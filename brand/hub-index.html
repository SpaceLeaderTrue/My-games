<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPACE</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#05080c; --ink:#f4f7fa; --soft:rgba(230,238,245,.7); --line:rgba(200,220,235,.14); --accent:#8ad0ec; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100svh;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;
      background-image:radial-gradient(ellipse 70% 50% at 80% 0%,rgba(90,150,190,.16),transparent 55%);
      padding:max(1.5rem,env(safe-area-inset-top)) 1.25rem 2.5rem}
    .wrap{max-width:42rem;margin:0 auto}
    .space-logo{height:1.4rem;width:auto;color:#fff;margin-bottom:2.2rem}
    h1{font-family:Syne,sans-serif;font-weight:800;font-size:clamp(2.2rem,7vw,3.5rem);letter-spacing:-.04em;line-height:.98;max-width:12ch}
    .lede{color:var(--soft);margin:1rem 0 2rem;max-width:32ch;line-height:1.45}
    .grid{display:grid;gap:.85rem}
    a.card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:18px;padding:1.15rem 1.2rem}
    a.card:hover{border-color:rgba(255,255,255,.28)}
    a.card em{color:var(--accent);font-style:normal;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;display:block;margin-bottom:.45rem}
    a.card strong{font-family:Syne,sans-serif;font-size:1.15rem;display:block;margin-bottom:.35rem}
    a.card p{color:var(--soft);font-size:.92rem;line-height:1.4}
  </style>
</head>

    <h1>Мир, в который хочется войти.</h1>
    <p class="lede">Игры и пространства SPACE — открывайте по ссылке.</p>

      <a class="card" href="./river-ocean/"><em>Игра</em><strong>Река → Океан</strong><p>Станьте потоком и найдите путь к горизонту.</p></a>

</html>
