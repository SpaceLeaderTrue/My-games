    *{box-sizing:border-box;margin:0;padding:0}

    .grid{display:grid;gap:.85rem}
    a.card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:18px;padding:1.15rem 1.2rem}
    a.card:hover{border-color:rgba(255,255,255,.28)}
    a.card em{color:var(--accent);font-style:normal;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;display:block;margin-bottom:.45rem}
    a.card strong{font-family:Syne,sans-serif;font-size:1.15rem;display:block;margin-bottom:.35rem}
    a.card p{color:var(--soft);font-size:.92rem;line-height:1.4}
  </style>
