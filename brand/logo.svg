<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="Space Island">
  <defs>
    <linearGradient id="siMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F7FB"/>
      <stop offset="55%" stop-color="#A8C4D8"/>
      <stop offset="100%" stop-color="#5EA0C4"/>
    </linearGradient>
    <linearGradient id="siWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7EC8E8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#7EC8E8"/>
      <stop offset="100%" stop-color="#7EC8E8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <!-- mark: horizon island with rising arc -->
  <g transform="translate(8,8)">
    <circle cx="24" cy="24" r="23" fill="none" stroke="url(#siMark)" stroke-width="1.25" opacity="0.55"/>
    <path d="M6 30 C14 22, 20 18, 24 18 C28 18, 34 22, 42 30" fill="none" stroke="url(#siMark)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M10 34 H38" stroke="url(#siWave)" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="24" cy="12" r="2.1" fill="#F4F7FB"/>
  </g>
  <g fill="#F4F7FB" font-family="Syne, Avenir Next, Segoe UI, sans-serif">
    <text x="66" y="28" font-size="18" font-weight="700" letter-spacing="0.22em">SPACE</text>
    <text x="66" y="48" font-size="12" font-weight="500" letter-spacing="0.42em" fill="#A8C4D8">ISLAND</text>
  </g>
</svg>
