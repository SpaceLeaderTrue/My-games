  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <canvas id="minimap" width="180" height="180" aria-label="Карта острова"></canvas>
      <div id="pinch-ring" class="pinch-ring" aria-hidden="true"></div>
      <div id="pinch-hint" class="pinch-hint" aria-hidden="true">двойной тап — телепорт</div>
      <div id="teleport-flash" class="teleport-flash" aria-hidden="true"></div>
      <div id="boot">Загрузка комнаты…</div>
      <button type="button" id="lock-hint" class="lock-hint">
        Нажмите, чтобы начать
        <span>корабль подойдёт к пристани, выйти можно самим</span>
      </button>
      <div class="crosshair" aria-hidden="true"></div>

      <div id="mobile-ui" class="mobile-ui" hidden>
        <div class="joy-zone" id="joy-zone" aria-label="Ходьба">
          <div class="joy-base" id="joy-base">
            <div class="joy-knob" id="joy-knob"></div>
          </div>
        </div>
        <div class="look-zone" id="look-zone" aria-label="Взгляд"></div>
        <div class="action-btns">
          <button type="button" id="btn-sprint" class="action-btn sprint">бег</button>
          <button type="button" id="btn-jump" class="action-btn jump">прыжок</button>
        </div>
      </div>

      <header class="hud-top">
        <div>
          <p class="brand">Space Island 3D</p>
          <p class="tagline">подходим к острову</p>
        </div>
        <p class="status"><span class="dot"></span> в эфире · 4 экрана</p>
      </header>

      <footer class="hud-bottom">
        <p class="hint"><b>WASD</b> · мышь · на телефоне — джойстик и свайп</p>
        <div class="controls">
          <button type="button" id="btn-mute" class="ctrl">Микрофон</button>
          <button type="button" id="btn-cam" class="ctrl on">Камера</button>
          <button type="button" id="btn-leave" class="ctrl leave">Выйти</button>
        </div>
      </footer>
    </div>
  </body>
</html>
