<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04070b" />
  <title>Река — SPACE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #04070b;
      --ink: #f4f7fa;
      --soft: rgba(228, 238, 246, 0.72);
      --dim: rgba(168, 196, 216, 0.48);
      --line: rgba(190, 220, 240, 0.14);
      --accent: #8ad0ec;
      --glass: rgba(6, 12, 18, 0.48);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #app {
      width: 100%; height: 100%; min-height: 100svh;
      background: var(--bg); color: var(--ink);
      font-family: Manrope, system-ui, sans-serif;
      overflow: hidden; position: fixed; inset: 0;
    }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .space-logo { height: 1.05rem; width: auto; display: block; color: #fff; }
    .space-logo.lg { height: 1.35rem; }
    .space-logo.xl { height: clamp(1.4rem, 3.5vw, 2rem); }
    .space-mark { width: 1.35rem; height: 1.35rem; color: #fff; display: block; }
    .logo { display: inline-flex; align-items: center; gap: 0.55rem; text-decoration: none; color: inherit; }
    .logo {
      display: inline-flex; align-items: center; gap: 0.65rem;
      text-decoration: none; color: inherit;
    }

    #intro {
      position: absolute; inset: 0; z-index: 8;
      display: grid; grid-template-rows: auto 1fr auto;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(4,7,11,0.35) 0%, transparent 28%, rgba(4,7,11,0.15) 55%, rgba(4,7,11,0.82) 100%);
      transition: opacity .55s ease;
    }
    #intro .top {
      pointer-events: auto;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 0 max(1rem, env(safe-area-inset-left));
    }
    #intro .hero {
      pointer-events: auto;
      align-self: end;
      padding: 0 max(1.35rem, env(safe-area-inset-right)) max(1.7rem, env(safe-area-inset-bottom)) max(1.35rem, env(safe-area-inset-left));
      max-width: 38rem;
      animation: rise 1.15s cubic-bezier(.22,1,.36,1) both;
    }
    #intro .brand-hero {
      margin-bottom: 1.15rem; color: var(--ink);
    }
    #intro .brand-hero .space-logo { filter: drop-shadow(0 10px 28px rgba(0,0,0,.35)); }
    #intro h1 {
      font-family: Syne, sans-serif; font-weight: 800;
      font-size: clamp(2.6rem, 8vw, 5rem); letter-spacing: -0.045em;
      line-height: 0.92; max-width: 9ch;
      text-shadow: 0 22px 60px rgba(0,0,0,0.5);
    }
    #intro .lede {
      margin-top: 1rem; color: var(--soft);
      font-size: clamp(0.98rem, 2.1vw, 1.12rem); line-height: 1.45; max-width: 28ch;
    }
    .cta-row { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: 1.45rem; }
    .btn {
      appearance: none; border: 0; cursor: pointer;
      font: 700 0.94rem/1 Manrope, sans-serif;
      border-radius: 999px; padding: 0.92rem 1.45rem;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--ink); color: #071018; }
    .btn-ghost {
      background: rgba(255,255,255,0.04); color: var(--ink);
      border: 1px solid var(--line); backdrop-filter: blur(12px);
    }

    #hud {
      position: absolute; inset: 0; z-index: 6; pointer-events: none;
      opacity: 0; transition: opacity .45s ease;
    }
    #hud.on { opacity: 1; }
    #hud .topbar {
      position: absolute;
      top: max(0.9rem, env(safe-area-inset-top));
      left: max(0.9rem, env(safe-area-inset-left));
      right: max(0.9rem, env(safe-area-inset-right));
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    }
    #hud .meter {
      min-width: 10rem; max-width: 14rem; flex: 1;
      padding: 0.55rem 0.8rem;
      background: var(--glass); border: 1px solid var(--line);
      border-radius: 14px; backdrop-filter: blur(16px);
    }
    #hud .meter label {
      display: flex; justify-content: space-between;
      font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 0.4rem;
    }
    #hud .track { height: 3px; border-radius: 99px; background: rgba(255,255,255,0.1); overflow: hidden; }
    #hud .fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #3aa0c8, #d4f0ff);
      box-shadow: 0 0 12px rgba(140, 210, 240, 0.45);
    }
    #hud .hint {
      position: absolute; left: 50%; bottom: max(1.2rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      color: var(--soft); font-size: 0.8rem;
      background: var(--glass); border: 1px solid var(--line);
      border-radius: 999px; padding: 0.55rem 1.05rem;
      backdrop-filter: blur(14px);
      transition: opacity .8s ease;
    }
    #hud .hint.hide { opacity: 0; pointer-events: none; }

    #win, #fail {
      position: absolute; inset: 0; z-index: 10; display: none;
      place-items: center; text-align: center;
      background: rgba(4,7,11,0.58); backdrop-filter: blur(22px);
      padding: 1.5rem;
    }
    #win.on, #fail.on { display: grid; animation: rise .7s cubic-bezier(.22,1,.36,1) both; }
    #win h2, #fail h2 {
      font-family: Syne, sans-serif; font-weight: 800;
      font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.04em;
    }
    #win .stats, #fail .stats {
      display: flex; justify-content: center; gap: 1.4rem;
      margin: 1rem 0 1.4rem; color: var(--soft); font-size: 0.85rem;
    }
    #win .stats b, #fail .stats b { display: block; color: var(--ink); font-family: Syne, sans-serif; font-size: 1.15rem; margin-bottom: 0.2rem; }
    #win p, #fail p { color: var(--soft); margin: 0 auto 1.35rem; max-width: 30ch; line-height: 1.4; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

const failEl = document.getElementById('fail');
const progressEl = document.getElementById('progress');
const pctEl = document.getElementById('pct');
const hintEl = document.getElementById('hint');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07121c);
scene.fog = new THREE.FogExp2(0x0a1824, 0.0095);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 16, -20);

const hemi = new THREE.HemisphereLight(0xc8e4f8, 0x1a2818, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe8c8, 1.55);
sun.position.set(-28, 42, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 160;
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
sun.shadow.bias = -0.0002;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x7ec8e8, 0.45);
rim.position.set(35, 10, -25);
scene.add(rim);
const fill = new THREE.DirectionalLight(0x406080, 0.25);
fill.position.set(0, 8, 40);
scene.add(fill);

// sky dome
{
  const skyGeo = new THREE.SphereGeometry(280, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      top: { value: new THREE.Color(0x0c1c2c) },
      mid: { value: new THREE.Color(0x163248) },
      bot: { value: new THREE.Color(0x2a5060) },
    },
    vertexShader: `varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top,mid,bot; varying vec3 vP; void main(){ float h=clamp(vP.y*0.5+0.5,0.0,1.0); vec3 c=mix(bot,mid,smoothstep(0.0,0.45,h)); c=mix(c,top,smoothstep(0.4,1.0,h)); gl_FragColor=vec4(c,1.0); }`,
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
}

// stars
{
  const n = 600, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 0.65 + 0.15);
    const r = 220;
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph);
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xd8eef8, size: 0.45, transparent: true, opacity: 0.55, depthWrite: false })));
}

const WORLD_LEN = 240;
const OCEAN_Z = 210;
const START_Z = -6;

function heightAt(x, z) {
  const n =
    Math.sin(x * 0.055) * 1.8 +
    Math.cos(z * 0.038) * 1.35 +
    Math.sin((x * 0.12) + z * 0.07) * 0.55 +
    Math.sin(x * 0.22) * Math.cos(z * 0.15) * 0.35;
  const valley = -Math.exp(-(x * x) / 220) * 2.1;
  let h = 1.35 + n * 0.62 + valley;
  if (z > 175) h = THREE.MathUtils.lerp(h, -1.4, Math.min(1, (z - 175) / 45));
  if (z < 20) h += Math.sin(z * 0.2) * 0.15;
  return h;
}

function biomeColor(x, z, y) {
  const t = THREE.MathUtils.clamp(z / OCEAN_Z, 0, 1);
  const c = new THREE.Color();
  if (t < 0.35) c.set(0x4f7a45);
  else if (t < 0.65) c.set(0x6a8a52);
  else if (t < 0.85) c.set(0x7a8a68);
  else c.set(0x8a9a78);
  // darker in valleys / river bed
  const valley = Math.exp(-(x * x) / 180);
  c.offsetHSL(0, 0, -0.08 * valley - Math.max(0, 0.6 - y) * 0.04);
  // sand near ocean
  if (z > 185) c.lerp(new THREE.Color(0xc4b08a), (z - 185) / 30);
  return c;
}

const groundGeo = new THREE.PlaneGeometry(110, WORLD_LEN + 50, 110, 180);
groundGeo.rotateX(-Math.PI / 2);
{
  const pos = groundGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i) + WORLD_LEN / 2 - 20;
    const y = heightAt(x, z);
    pos.setY(i, y);
    pos.setZ(i, z);
    const c = biomeColor(x, z, y);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(
  groundGeo,
  new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.9,
    metalness: 0.03,
  })
);
ground.receiveShadow = true;
scene.add(ground);

// ocean with gentle vertex animation
const oceanGeo = new THREE.PlaneGeometry(200, 110, 64, 32);
oceanGeo.rotateX(-Math.PI / 2);
const ocean = new THREE.Mesh(
  oceanGeo,
  new THREE.MeshStandardMaterial({
    color: 0x1a9ec8,
    roughness: 0.08,
    metalness: 0.42,
    transparent: true,
    opacity: 0.94,
    emissive: 0x0a3048,
    emissiveIntensity: 0.2,
  })
);
ocean.position.set(0, -1.05, OCEAN_Z + 36);
ocean.receiveShadow = true;
scene.add(ocean);

// horizon band
{
  const band = new THREE.Mesh(
    new THREE.PlaneGeometry(220, 28),
    new THREE.MeshBasicMaterial({ color: 0x9ad4ea, transparent: true, opacity: 0.14, depthWrite: false })
  );
  band.position.set(0, 6, OCEAN_Z + 70);
  scene.add(band);
}

const rocks = [];
const rockMats = [
  new THREE.MeshStandardMaterial({ color: 0x4a5058, roughness: 0.86, metalness: 0.12 }),
  new THREE.MeshStandardMaterial({ color: 0x3a424c, roughness: 0.9, metalness: 0.08 }),
  new THREE.MeshStandardMaterial({ color: 0x5a6270, roughness: 0.82, metalness: 0.15 }),
];
function addRock(x, z, s = 1) {
  const g = new THREE.Group();
  const n = 2 + (Math.random() * 2 | 0);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(
      new THREE.DodecahedronGeometry((0.7 + Math.random() * 0.55) * s, 0),
      rockMats[i % rockMats.length]
    );
    m.position.set((Math.random() - 0.5) * s, (Math.random() * 0.4) * s, (Math.random() - 0.5) * s);
    m.rotation.set(Math.random(), Math.random(), Math.random());
    m.castShadow = true;
    m.receiveShadow = true;
    g.add(m);
  }
  g.position.set(x, heightAt(x, z) + 0.35 * s, z);
  g.userData.r = 1.25 * s;
  scene.add(g);
  rocks.push(g);
}
for (let i = 0; i < 34; i++) {
  const z = 14 + i * 5.6 + (i % 3) * 1.1;
  const side = i % 2 ? 1 : -1;
  const x = side * (6.2 + (i % 5) * 1.6) + Math.sin(i * 1.7) * 1.1;
  addRock(x, z, 0.75 + (i % 4) * 0.2);
}
for (const [x, z, s] of [[-3.4, 58, 1.15], [4.0, 82, 1.05], [-4.6, 108, 1.25], [3.8, 134, 1.0], [-2.6, 158, 1.1], [2.2, 178, 0.95]]) {
  addRock(x, z, s);
}

const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1c, roughness: 0.92 });
const leafMats = [
  new THREE.MeshStandardMaterial({ color: 0x2a6a42, roughness: 0.82 }),
  new THREE.MeshStandardMaterial({ color: 0x3a7a48, roughness: 0.8 }),
  new THREE.MeshStandardMaterial({ color: 0x1f5a38, roughness: 0.85 }),
];
for (let i = 0; i < 56; i++) {
  const g = new THREE.Group();
  const h = 2.0 + (i % 5) * 0.35;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.18, h, 7), trunkMat);
  trunk.position.y = h / 2;
  trunk.castShadow = true;
  g.add(trunk);
  for (let L = 0; L < 3; L++) {
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.85 - L * 0.18, 1.5 - L * 0.15, 8), leafMats[(i + L) % 3]);
    leaf.position.y = h * 0.55 + L * 0.7;
    leaf.castShadow = true;
    g.add(leaf);
  }
  const x = (i % 2 ? 1 : -1) * (15 + (i % 9) * 1.35 + Math.sin(i) * 0.8);
  const z = 4 + i * 4.1;
  g.position.set(x, heightAt(x, z), z);
  g.scale.setScalar(0.85 + (i % 4) * 0.12);
  scene.add(g);
}

// mist sheets
const mist = [];
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 8),
    new THREE.MeshBasicMaterial({ color: 0xb8d8e8, transparent: true, opacity: 0.04 + (i % 3) * 0.015, depthWrite: false })
  );
  m.position.set((i % 2 ? 8 : -8), 3 + (i % 3), 30 + i * 22);
  m.rotation.y = (i % 2 ? 0.2 : -0.2);
  scene.add(m);
  mist.push(m);
}

// elegant in-world mark near start (not a heavy billboard)
{
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.8, 0.035, 8, 48),
    new THREE.MeshStandardMaterial({ color: 0xc8e0f0, emissive: 0x204858, emissiveIntensity: 0.4, metalness: 0.6, roughness: 0.25 })
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.set(0, heightAt(0, 12) + 0.08, 12);
  scene.add(ring);
}

const path = [];
const MAX_POINTS = 480;
let head = new THREE.Vector3(0, heightAt(0, START_Z) + 0.4, START_Z);
let vel = new THREE.Vector3(0, 0, 1);
let steer = 0;
let alive = true;
let mode = 'trailer';
let time = 0;
let playTime = 0;
let camBank = 0;

const headMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.48, 28, 18),
  new THREE.MeshStandardMaterial({
    color: 0xd0f0ff,
    emissive: 0x1a7098,
    emissiveIntensity: 0.85,
    roughness: 0.12,
    metalness: 0.28,
  })
);
headMesh.castShadow = true;
scene.add(headMesh);

const glow = new THREE.PointLight(0x7ec8e8, 1.4, 12, 2);
headMesh.add(glow);

const trailMat = new THREE.MeshStandardMaterial({
  color: 0x3db8e0,
  emissive: 0x0c4868,
  emissiveIntensity: 0.55,
  roughness: 0.14,
  metalness: 0.32,
  transparent: true,
  opacity: 0.94,
});
let trailMesh = null;

function rebuildTrail() {
  if (path.length < 2) return;
  const curve = new THREE.CatmullRomCurve3(path.map((p) => p.clone()));
  const tubular = Math.min(path.length * 2, 300);
  const geo = new THREE.TubeGeometry(curve, tubular, 0.48, 12, false);
  if (trailMesh) {
    trailMesh.geometry.dispose();
    trailMesh.geometry = geo;
  } else {
    trailMesh = new THREE.Mesh(geo, trailMat);
    trailMesh.castShadow = true;
    scene.add(trailMesh);
  }
}

const sprayCount = 220;
const sprayPos = new Float32Array(sprayCount * 3);
const sprayGeo = new THREE.BufferGeometry();
sprayGeo.setAttribute('position', new THREE.BufferAttribute(sprayPos, 3));
const sprayPts = new THREE.Points(
  sprayGeo,
  new THREE.PointsMaterial({ color: 0xe8f8ff, size: 0.1, transparent: true, opacity: 0.7, depthWrite: false })
);
scene.add(sprayPts);

const keys = Object.create(null);
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
let pointerX = 0, pointerActive = false;
canvas.addEventListener('pointerdown', (e) => {
  pointerActive = true; pointerX = e.clientX;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointerActive) return;
  const dx = e.clientX - pointerX;
  pointerX = e.clientX;
  steer = THREE.MathUtils.clamp(steer + dx * 0.0035, -1, 1);
});
canvas.addEventListener('pointerup', () => { pointerActive = false; });
canvas.addEventListener('pointercancel', () => { pointerActive = false; });

function resetRun() {
  path.length = 0;
  head.set(0, heightAt(0, START_Z) + 0.4, START_Z);
  vel.set(0, 0, 1);
  steer = 0; alive = true; playTime = 0; camBank = 0;
  path.push(head.clone());
  rebuildTrail();
  winEl.classList.remove('on');
  failEl.classList.remove('on');
  progressEl.style.width = '0%';
  pctEl.textContent = '0%';
  hintEl.classList.remove('hide');
  setTimeout(() => hintEl.classList.add('hide'), 4200);
}

function startPlay() {
  mode = 'play';
  intro.style.opacity = '0';
  intro.style.pointerEvents = 'none';
  setTimeout(() => { intro.style.display = 'none'; }, 560);
  hud.classList.add('on');
  hud.setAttribute('aria-hidden', 'false');
  resetRun();
  if (matchMedia('(pointer: coarse)').matches) hintEl.textContent = 'Свайп влево / вправо';
}

document.getElementById('btn-start').onclick = startPlay;
document.getElementById('btn-watch').onclick = () => {
  intro.querySelector('.hero').style.opacity = '0.25';
};
document.getElementById('btn-again').onclick = () => { resetRun(); mode = 'play'; };
document.getElementById('btn-retry').onclick = () => { resetRun(); mode = 'play'; };

function hitRock() {
  for (const r of rocks) {
    const dx = head.x - r.position.x;
    const dz = head.z - r.position.z;
    if (dx * dx + dz * dz < r.userData.r * r.userData.r) return true;
  }
  return false;
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function updateOcean(dt) {
  const pos = ocean.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    pos.setY(i, Math.sin(x * 0.12 + time * 1.4) * 0.18 + Math.cos(z * 0.09 + time * 1.1) * 0.14);
  }
  pos.needsUpdate = true;
  ocean.geometry.computeVertexNormals();
}

function update(dt) {
  time += dt;
  updateOcean(dt);
  for (let i = 0; i < mist.length; i++) {
    mist[i].position.x = Math.sin(time * 0.15 + i) * 10 + (i % 2 ? 6 : -6);
    mist[i].material.opacity = 0.035 + Math.sin(time * 0.4 + i) * 0.012;
  }

  if (mode === 'trailer') {
    const t = time * 0.1;
    camera.position.set(Math.sin(t) * 14, 12 + Math.sin(t * 0.6) * 1.8, -12 + Math.cos(t * 0.45) * 10);
    camera.lookAt(0, 1.5, 35 + Math.sin(t) * 8);
    if (path.length < 100) {
      const z = START_Z + path.length * 0.5;
      const x = Math.sin(z * 0.07) * 2.4;
      head.set(x, heightAt(x, z) + 0.4, z);
      path.push(head.clone());
      if (path.length % 2 === 0) rebuildTrail();
    }
    headMesh.position.copy(head);
    return;
  }

  if (mode !== 'play' || !alive) {
    const hold = new THREE.Vector3(head.x * 0.35 - camBank * 2, head.y + 9, head.z - 15);
    camera.position.lerp(hold, 1 - Math.exp(-2 * dt));
    camera.lookAt(head.x, head.y + 1, head.z + 10);
    return;
  }

  playTime += dt;
  let input = 0;
  if (keys.ArrowLeft || keys.KeyA) input -= 1;
  if (keys.ArrowRight || keys.KeyD) input += 1;
  steer = THREE.MathUtils.damp(steer, input !== 0 ? input : steer * 0.25, 7, dt);

  const speed = 12.5;
  vel.x = THREE.MathUtils.damp(vel.x, steer * 8.2, 5.5, dt);
  head.x += vel.x * dt;
  head.z += speed * dt * 0.52;
  head.x = THREE.MathUtils.clamp(head.x, -17, 17);
  head.y = heightAt(head.x, head.z) + 0.42;

  path.push(head.clone());
  if (path.length > MAX_POINTS) path.shift();
  if (path.length % 2 === 0) rebuildTrail();

  headMesh.position.copy(head);
  headMesh.scale.setScalar(1 + Math.sin(time * 9) * 0.05 + Math.abs(steer) * 0.08);

  const turn = Math.abs(steer);
  for (let i = 0; i < sprayCount; i++) {
    const a = time * 3 + i * 0.37;
    const spread = 0.35 + turn * 0.7;
    sprayPos[i * 3] = head.x + Math.sin(a) * spread;
    sprayPos[i * 3 + 1] = head.y + 0.15 + (i % 9) * 0.04 * (0.5 + turn);
    sprayPos[i * 3 + 2] = head.z - (i % 14) * 0.1;
  }
  sprayGeo.attributes.position.needsUpdate = true;
  sprayPts.material.opacity = 0.35 + turn * 0.45;

  const prog = THREE.MathUtils.clamp((head.z - START_Z) / (OCEAN_Z - START_Z), 0, 1);
  progressEl.style.width = `${(prog * 100).toFixed(1)}%`;
  pctEl.textContent = `${Math.round(prog * 100)}%`;

  camBank = THREE.MathUtils.damp(camBank, -steer * 0.18, 4, dt);
  const camTarget = new THREE.Vector3(head.x * 0.5 + camBank * 6, head.y + 8.8, head.z - 13.5);
  camera.position.lerp(camTarget, 1 - Math.exp(-3.4 * dt));
  camera.lookAt(head.x, head.y + 1.1, head.z + 14);
  camera.rotation.z = camBank;

  if (hitRock()) {
    alive = false;
    mode = 'fail';
    failEl.classList.add('on');
    return;
  }
  if (head.z >= OCEAN_Z - 1.5) {
    alive = false;
    mode = 'win';
    document.getElementById('win-time').textContent = fmtTime(playTime);
    document.getElementById('win-dist').textContent = `${Math.round(head.z - START_Z)} м`;
    winEl.classList.add('on');
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
  </script>
</body>
</html>
