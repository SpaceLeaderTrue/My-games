<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>SPACE — Cockpit</title>
  <style>
    :root {
      --text: #e8eef8;
      --muted: rgba(210, 220, 235, 0.65);
      --accent: #7eb6ff;
      --warn: #ffb454;
      --ok: #5ddea8;
      --panel: #0c1016;
      --display: "Orbitron", "Avenir Next", "Segoe UI", sans-serif;
      --mono: "Share Tech Mono", "Menlo", "Consolas", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--text);
      font-family: var(--mono);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .stage { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #stars { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
    .cockpit {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; pointer-events: none;
      height: clamp(196px, 32vh, 260px); transform-origin: 50% 100%; will-change: transform;
    }
    .dash {
      position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      width: min(940px, 100%); height: 100%;
      background: linear-gradient(to top, #05070a 0%, #10151d 55%, #1a222e 100%);
      border-radius: 18px 18px 0 0; border-top: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 -14px 36px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
      display: grid; grid-template-columns: 1.05fr 1.45fr 1.05fr; gap: 10px;
      padding: 12px 14px 70px; align-items: stretch;
      z-index: 1;
      transition: transform 0.55s cubic-bezier(0.22, 0.8, 0.28, 1), opacity 0.45s ease, filter 0.45s ease;
    }
    .cockpit.immersive .dash {
      transform: translateX(-50%) translateY(78%);
      opacity: 0.26;
      filter: saturate(0.65) brightness(0.9);
      pointer-events: none;
      box-shadow: 0 -8px 20px rgba(0,0,0,0.35);
    }
    .dash::before {
      content: ""; position: absolute; left: 12%; right: 12%; top: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(126,182,255,0.5), transparent);
    }
    .screen {
      border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: var(--panel);
      position: relative; overflow: hidden;
      box-shadow: inset 0 0 22px rgba(0,0,0,0.7); min-height: 0; padding: 8px;
    }
    .screen .scan {
      position: absolute; inset: 0; z-index: 3; pointer-events: none;
      background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(255,255,255,0.025) 2px 3px);
    }
    .screen .label {
      position: relative; z-index: 4; font-family: var(--display); font-size: 8px;
      letter-spacing: 0.18em; text-transform: uppercase; color: rgba(180, 205, 235, 0.7); margin-bottom: 4px;
    }
    .screen.nav { display: grid; grid-template-rows: auto 1fr auto; gap: 5px; }
    .adi {
      position: relative; z-index: 1; width: min(100%, 130px); aspect-ratio: 1.2; max-height: 86px;
      margin: 0 auto; border-radius: 50%; overflow: hidden;
      border: 2px solid rgba(180,200,230,0.28); background: #041018;
      box-shadow: inset 0 0 16px rgba(0,0,0,0.85);
    }
    .adi-ball {
      position: absolute; left: -45%; top: -90%; width: 190%; height: 280%;
      transform-origin: 50% 50%; will-change: transform;
    }
    .adi-sky { height: 50%; background: linear-gradient(#1a4a7a, #2f74b0); }
    .adi-ground { height: 50%; background: linear-gradient(#7a5630, #3a2814); }
    .adi-horizon {
      position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px;
      background: #f0f4ff; box-shadow: 0 0 6px rgba(255,255,255,0.5);
    }
    .adi-ladder {
      position: absolute; left: 32%; right: 32%; top: 50%; height: 0;
      border-top: 1px solid rgba(255,255,255,0.3);
    }
    .adi-ladder::before, .adi-ladder::after {
      content: ""; position: absolute; left: 12%; right: 12%; height: 0;
      border-top: 1px solid rgba(255,255,255,0.22);
    }
    .adi-ladder::before { top: -16px; }
    .adi-ladder::after { top: 16px; }
    .adi-wing {
      position: absolute; z-index: 2; left: 50%; top: 50%; width: 56%; height: 2px;
      margin-left: -28%; margin-top: -1px; background: #ffb454;
      box-shadow: 0 0 8px rgba(255,180,84,0.5);
    }
    .adi-wing::before {
      content: ""; position: absolute; left: 50%; top: -5px; width: 8px; height: 8px;
      margin-left: -4px; border: 2px solid #ffb454; border-radius: 50%;
    }
    .compass {
      position: relative; z-index: 1; height: 22px; overflow: hidden; border-radius: 3px;
      background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.08);
    }
    .compass-tape {
      position: absolute; top: 0; height: 100%; display: flex; align-items: center;
      will-change: transform; font-size: 10px; letter-spacing: 0.06em; color: rgba(220,235,255,0.85);
    }
    .compass-tape span { width: 36px; text-align: center; flex-shrink: 0; }
    .compass-tape span.card {
      color: var(--warn); font-family: var(--display); font-size: 9px;
    }
    .compass-needle {
      position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px;
      background: var(--warn); z-index: 2; box-shadow: 0 0 6px rgba(255,180,84,0.55);
    }
    .screen.main {
      background:
        radial-gradient(ellipse at 50% 0%, rgba(90, 40, 140, 0.38), transparent 55%),
        linear-gradient(165deg, #241033, #12081c 60%, #0a0612);
      display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 6px; padding: 8px 10px;
    }
    .speed-wrap {
      position: relative; z-index: 1; display: grid; grid-template-columns: auto 1fr auto;
      gap: 8px; align-items: center;
    }
    .speed-wrap .spd-label {
      font-family: var(--display); font-size: 8px; letter-spacing: 0.14em;
      color: rgba(220,230,255,0.55);
    }
    .speed-wrap .spd-track {
      height: 7px; border-radius: 2px; background: rgba(255,255,255,0.08);
      overflow: hidden; border: 1px solid rgba(255,255,255,0.06);
    }
    .speed-wrap .spd-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #5a8fff, #d4e6ff);
      box-shadow: 0 0 10px rgba(126,182,255,0.45);
    }
    .speed-wrap .spd-val {
      font-size: 12px; font-variant-numeric: tabular-nums; color: #e8ddff;
      min-width: 2.6em; text-align: right;
    }
    .readout-row {
      position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
    }
    .readout {
      background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px; padding: 4px 6px; min-width: 0;
    }
    .readout .k {
      font-family: var(--display); font-size: 7px; letter-spacing: 0.14em;
      color: rgba(200,210,240,0.5);
    }
    .readout .v {
      font-size: 14px; letter-spacing: 0.06em; color: #f0e8ff;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .radar {
      position: relative; z-index: 1; height: 30px; border-radius: 3px;
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.07); overflow: hidden;
    }
    .radar-sweep {
      position: absolute; inset: -50%;
      background: conic-gradient(from 0deg, transparent 0 68%, rgba(126,182,255,0.22) 88%, transparent 100%);
      animation: sweep 3.2s linear infinite; transform-origin: 50% 50%;
    }
    .radar-grid {
      position: absolute; inset: 0; opacity: 0.45;
      background:
        linear-gradient(rgba(126,182,255,0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(126,182,255,0.14) 1px, transparent 1px);
      background-size: 12px 12px;
    }
    .map-fix {
      position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
      font-size: 9px; letter-spacing: 0.14em; color: rgba(220, 232, 255, 0.9);
      text-shadow: 0 1px 4px #000;
    }
    @keyframes sweep { to { transform: rotate(360deg); } }
    .status-row {
      position: relative; z-index: 1; display: flex; align-items: center;
      justify-content: space-between; gap: 8px; margin-top: auto;
    }
    .status-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      font-family: var(--display); font-size: 7px; letter-spacing: 0.12em;
      padding: 3px 7px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.12);
      color: rgba(200,210,230,0.55); background: rgba(0,0,0,0.25);
    }
    .pill.on {
      color: #04120c; background: var(--ok); border-color: transparent;
      box-shadow: 0 0 10px rgba(93,222,168,0.45);
    }
    .pill.warn {
      color: #1a1000; background: var(--warn); border-color: transparent;
      box-shadow: 0 0 10px rgba(255,180,84,0.4);
    }
    .brand-mini {
      font-family: var(--display); font-size: 11px; letter-spacing: 0.32em;
      color: rgba(230,220,255,0.9);
    }
    .screen.eng {
      display: grid;
      grid-template-rows: auto auto auto auto;
      gap: 3px;
      align-content: start;
    }
    .thrust-gauge {
      position: relative; z-index: 1; width: 100%; max-width: 108px; margin: 0 auto; aspect-ratio: 1.45;
    }
    .thrust-gauge svg { width: 100%; height: 100%; overflow: visible; }
    .thrust-val {
      position: absolute; left: 0; right: 0; bottom: 6%; text-align: center;
      font-family: var(--display); font-size: 15px; color: var(--accent);
      text-shadow: 0 0 12px rgba(126,182,255,0.35);
    }
    .thrust-val small {
      display: block; font-size: 7px; letter-spacing: 0.16em;
      color: rgba(180,200,230,0.55); margin-top: 2px;
    }
    .eng-bars { position: relative; z-index: 1; display: grid; gap: 5px; }
    .ebar {
      display: grid; grid-template-columns: 32px 1fr 26px; gap: 4px; align-items: center;
      font-size: 8px; color: rgba(190,210,235,0.65);
    }
    .ebar .track { height: 5px; background: rgba(255,255,255,0.08); border-radius: 1px; overflow: hidden; }
    .ebar .fill { height: 100%; width: 0%; border-radius: 1px; }
    .ebar .fill.thr { background: linear-gradient(90deg, #3d7cff, #9ec1ff); }
    .ebar .fill.heat { background: linear-gradient(90deg, #5ddea8, #ffb454 70%, #ff6b4a); }
    .ebar .fill.cool { background: linear-gradient(90deg, #3a9ecc, #7ed0ff); }
    .ebar .num { text-align: right; font-variant-numeric: tabular-nums; color: rgba(220,230,255,0.85); }
    .audio-btn {
      position: relative; z-index: 5; pointer-events: auto; cursor: pointer;
      margin-top: 4px; width: 100%;
      font-family: var(--display); font-size: 7px; letter-spacing: 0.14em;
      padding: 5px 6px; border-radius: 3px;
      border: 1px solid rgba(126,182,255,0.35);
      background: rgba(0, 12, 28, 0.65); color: rgba(190, 215, 255, 0.85);
    }
    .audio-btn:active, .audio-btn.on {
      background: rgba(126, 182, 255, 0.22);
      border-color: rgba(180, 210, 255, 0.7);
      color: #e8f0ff;
      box-shadow: 0 0 12px rgba(126,182,255,0.25);
    }
    .audio-btn.galactic {
      border-color: rgba(200, 140, 255, 0.5);
      color: rgba(230, 200, 255, 0.9);
      background: rgba(28, 8, 48, 0.7);
    }
    .audio-btn.galactic.on {
      background: rgba(180, 100, 255, 0.28);
      box-shadow: 0 0 14px rgba(180,100,255,0.35);
    }
    .yoke-wrap {
      position: absolute; left: 50%; bottom: clamp(4px, 1vh, 12px); transform: translateX(-50%);
      width: clamp(180px, 34vw, 260px); height: clamp(78px, 12vh, 108px); z-index: 6;
    }
    .yoke {
      position: relative; width: 100%; height: 100%; transform-origin: 50% 85%;
      transform: translateY(var(--yoke-pull, 0px)) rotate(var(--yoke-rot, 0deg)); will-change: transform;
    }
    .yoke-column {
      position: absolute; left: 50%; bottom: 0; width: 18px; height: 48%; transform: translateX(-50%);
      border-radius: 8px; background: linear-gradient(90deg, #12151a, #2b313c, #12151a);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .yoke-bar {
      position: absolute; left: 6%; right: 6%; top: 28%; height: 16px; border-radius: 10px;
      background: linear-gradient(#2f3642, #151920);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 6px 14px rgba(0,0,0,0.45);
    }
    .grip {
      position: absolute; top: 8%; width: 34px; height: 58%; border-radius: 14px;
      background: linear-gradient(90deg, #0f1217, #2a303a 45%, #0f1217);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 8px 16px rgba(0,0,0,0.4);
    }
    .grip.l { left: 0; } .grip.r { right: 0; }
    .yoke-hub {
      position: absolute; left: 50%; top: 18%; width: 72px; height: 52px; transform: translateX(-50%);
      border-radius: 10px; background: radial-gradient(circle at 50% 40%, #243041, #0c1016 70%);
      border: 1px solid rgba(255,255,255,0.12); display: grid; place-items: center;
      box-shadow: 0 0 18px rgba(158, 193, 255, 0.12);
    }
    .yoke-hub svg { width: 88%; height: auto; }
    .yoke-hub path { fill: #f2f2f2; }
    .pad {
      position: absolute; right: max(10px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom)); z-index: 9;
      display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px 50px;
      gap: 7px; pointer-events: auto;
      width: 164px; height: 164px;
    }
    .pad.stick-mode {
      display: block;
      background: transparent;
      border: none;
    }
    .pad.stick-mode > button { display: none; }
    .pad button {
      border: 1px solid rgba(180,200,230,0.2); background: rgba(10, 12, 16, 0.78);
      color: var(--text); border-radius: 11px; font-size: 16px; backdrop-filter: blur(8px);
    }
    .pad button.held, .pad button:active {
      background: rgba(158, 193, 255, 0.22); border-color: rgba(158, 193, 255, 0.55);
    }
    .pad .up { grid-column: 2; grid-row: 1; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .right { grid-column: 3; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 3; }
    .joy {
      display: none;
      position: absolute; inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(20, 28, 40, 0.35) 0 38%, transparent 40%),
        rgba(8, 10, 14, 0.72);
      border: 1px solid rgba(180,200,230,0.22);
      backdrop-filter: blur(8px);
      touch-action: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 8px 20px rgba(0,0,0,0.35);
    }
    .pad.stick-mode .joy { display: block; }
    .joy::before {
      content: ""; position: absolute; left: 50%; top: 50%;
      width: 62%; height: 62%; transform: translate(-50%, -50%);
      border-radius: 50%; border: 1px dashed rgba(180,200,230,0.18);
      pointer-events: none;
    }
    .joy-knob {
      position: absolute; left: 50%; top: 50%;
      width: 58px; height: 58px; margin: -29px 0 0 -29px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #3a4558, #12161e 70%);
      border: 1px solid rgba(200,215,235,0.35);
      box-shadow: 0 6px 14px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
      pointer-events: none;
      transition: box-shadow 0.15s ease;
    }
    .joy.active .joy-knob {
      box-shadow: 0 0 16px rgba(158,193,255,0.35), 0 6px 14px rgba(0,0,0,0.45);
      border-color: rgba(158,193,255,0.65);
    }
    .galaxy-nav {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      z-index: 10;
      width: 168px;
      padding: 8px 8px 6px;
      border-radius: 14px;
      background: rgba(6, 8, 12, 0.72);
      border: 1px solid rgba(180, 200, 230, 0.18);
      backdrop-filter: blur(10px);
      pointer-events: auto;
    }
    .galaxy-nav .label {
      font-family: var(--display);
      font-size: 8px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(180, 205, 235, 0.75);
      margin-bottom: 4px;
    }
    #navMap { width: 152px; height: 152px; display: block; cursor: pointer; border-radius: 8px; }
    .ctrl-toggle {
      position: absolute;
      top: calc(max(10px, env(safe-area-inset-top)) + 188px);
      left: max(10px, env(safe-area-inset-left));
      z-index: 10;
      pointer-events: auto;
      font-family: var(--display); font-size: 12px; letter-spacing: 0.14em;
      padding: 10px 14px; border-radius: 12px; cursor: pointer;
      border: 1px solid rgba(180,200,230,0.2);
      background: rgba(6, 8, 12, 0.72); color: rgba(210,220,235,0.85);
      backdrop-filter: blur(10px);
      min-width: 56px; text-align: center;
    }
    .ctrl-toggle small {
      display: block; margin-top: 3px; font-family: var(--mono);
      font-size: 8px; letter-spacing: 0.04em; opacity: 0.65; text-transform: none;
    }
    .ctrl-toggle.on {
      background: rgba(158, 193, 255, 0.22);
      border-color: rgba(158, 193, 255, 0.55);
      color: #f2f7ff;
    }
    .gearbox {
      position: absolute;
      left: max(10px, env(safe-area-inset-left));
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + 78px);
      z-index: 9;
      pointer-events: auto;
      width: 72px;
      padding: 8px 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(180,200,230,0.2);
      background: rgba(8, 10, 14, 0.82);
      backdrop-filter: blur(8px);
      user-select: none;
      touch-action: none;
    }
    .gearbox .gear-label {
      font-family: var(--display); font-size: 8px; letter-spacing: 0.16em;
      color: rgba(180,200,230,0.55); text-align: center; margin-bottom: 6px;
    }
    .gearbox .gear-track {
      position: relative;
      height: 108px;
      margin: 0 auto;
      width: 18px;
      border-radius: 9px;
      background: linear-gradient(#0a0c10, #171b22);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.65);
    }
    .gearbox .gear-slot {
      position: absolute; left: 50%; transform: translateX(-50%);
      width: 28px; height: 22px;
      display: grid; place-items: center;
      font-family: var(--display); font-size: 10px; letter-spacing: 0.08em;
      color: rgba(200,210,230,0.45); cursor: pointer;
      border: none; background: transparent; padding: 0;
    }
    .gearbox .gear-slot[data-gear="D"] { top: 2px; }
    .gearbox .gear-slot[data-gear="N"] { top: 43px; }
    .gearbox .gear-slot[data-gear="R"] { bottom: 2px; }
    .gearbox .gear-slot.on-d { color: #9ec1ff; }
    .gearbox .gear-slot.on-n { color: #e8eef8; }
    .gearbox .gear-slot.on-r { color: #ffb454; }
    .gearbox .gear-knob {
      position: absolute; left: 50%; top: 50%;
      width: 26px; height: 26px; margin: -13px 0 0 -13px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #4a5568, #151a22 70%);
      border: 1px solid rgba(220,230,245,0.35);
      box-shadow: 0 4px 10px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.14);
      transition: top 0.28s cubic-bezier(0.22, 0.8, 0.28, 1), background 0.2s ease, border-color 0.2s ease;
      pointer-events: none;
      z-index: 2;
    }
    .gearbox.gear-D .gear-knob { top: 14%; }
    .gearbox.gear-N .gear-knob { top: 50%; }
    .gearbox.gear-R .gear-knob { top: 86%; }
    .gearbox.gear-R .gear-knob {
      background: radial-gradient(circle at 35% 30%, #8a5a30, #2a1810 70%);
      border-color: rgba(255,180,110,0.55);
    }
    .gearbox.gear-D .gear-knob {
      background: radial-gradient(circle at 35% 30%, #3d6a9a, #101820 70%);
      border-color: rgba(158,193,255,0.55);
    }
    .gearbox.braking .gear-knob {
      box-shadow: 0 0 12px rgba(255,180,90,0.45), 0 4px 10px rgba(0,0,0,0.45);
    }
    .star-looks {
      position: absolute; top: max(10px, env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 6px; pointer-events: auto;
      padding: 6px; border-radius: 12px;
      background: rgba(6, 8, 12, 0.72); border: 1px solid rgba(180,200,230,0.16);
      backdrop-filter: blur(10px);
    }
    .star-looks button {
      font-family: var(--display); font-size: 10px; letter-spacing: 0.12em;
      padding: 8px 12px; border-radius: 8px; cursor: pointer;
      border: 1px solid rgba(180,200,230,0.2);
      background: transparent; color: rgba(210,220,235,0.75);
      min-width: 72px;
    }
    .star-looks button small {
      display: block; margin-top: 3px; font-family: var(--mono);
      font-size: 8px; letter-spacing: 0.04em; opacity: 0.65; text-transform: none;
    }
    .star-looks button.on {
      background: rgba(158, 193, 255, 0.22);
      border-color: rgba(158, 193, 255, 0.55);
      color: #f2f7ff;
    }
    .view-toggle {
      position: absolute;

  <script>
    (() => {
      const canvas = document.getElementById("stars");

        streak: {

          sizeNear: [1.15, 1.85],

          coreMin: 1.05,

          haloOuter: 0,

          trailAlpha: 0.4,

      };
      let starLook = STAR_LOOKS.pin;

      let joyActive = false;

      function setStickMode(on) {
        stickMode = !!on;
        joyActive = false;
        keys.clear();
        stickX = 0;
        stickY = 0;
        const pad = document.getElementById("pad");
        const joy = document.getElementById("joy");
        const knob = document.getElementById("joyKnob");
        const btn = document.getElementById("ctrlToggle");
        if (pad) pad.classList.toggle("stick-mode", stickMode);
        if (joy) {

          joy.setAttribute("aria-hidden", stickMode ? "false" : "true");
        }
        if (knob) knob.style.transform = "translate(0px, 0px)";
        if (btn) {
          btn.classList.toggle("on", stickMode);
          btn.setAttribute("aria-pressed", stickMode ? "true" : "false");
          btn.innerHTML = stickMode ? "J<small>кнопки</small>" : "J<small>стик</small>";
        }
      }
      // Web Audio freezes if setTargetAtTime floods every rAF — push ≤ ~20 Hz
      const AUDIO_PUSH_MS = 48;
      const TURN_RATE = 1.1;
      const PITCH_BOOST = 1.5;
      const STICK_SMOOTH = 7.5;
      const RATE_SMOOTH = 5.8;
      const PITCH_RATE_SMOOTH = 6.2;
      const BANK_MAX = 0.42;
      const BANK_SMOOTH = 5.5;

      let stars = [];
      let w = 0, h = 0, cx = 0, cy = 0;
      let speed = 0;
      let thrusting = false;
      let thrustPointer = false;
      let thrustGate = false; // after gear change: release gas, then press again
      let gear = "D"; // D | N | R
      let gearPending = null; // while braking to a new gear
      let reverse = false; // true only when gear R is active for motion
      let braking = false;
      let hoverRockT = 0;
      let warpSmooth = 0; // visual trail amount — eases, brightness does not
      const SPEED_MIN = 0; // true stop (no crawl)
      const SPEED_MAX = 4.5;
      const SPEED_MAX_REV = SPEED_MAX * 0.5;
      const HOVER_SPEED = 0;
      const NEUTRAL_DRIFT = 0.42; // slow forward glide in neutral
      const COAST = 0.62; // minimum forward speed when the throttle is released
      const ACCEL = 2.2;
      const DECEL = 1.35;
      const BRAKE_DECEL = 3.6;
      // Free orientation (body: +X right, +Y up, +Z forward)
      let orient = [0, 0, 0, 1];
      const ship = { x: 0, y: 0, z: 0 };
      const PLACES = [
        { name: "СОЛНЦЕ", x: 0, y: 0, z: 520, r: 86, color: "#ffe08a", kind: "sun", spin: 0.04 },
        { name: "МЕРКУРИЙ", x: 70, y: 8, z: 700, r: 10, color: "#c4b29a", kind: "mercury", spin: 0.12 },
        { name: "ВЕНЕРА", x: -90, y: -10, z: 920, r: 20, color: "#e6c48a", kind: "venus", spin: 0.05 },
        { name: "ЗЕМЛЯ", x: 110, y: 6, z: 1180, r: 22, color: "#6eb0e8", kind: "earth", spin: 0.18 },
        { name: "ЛУНА", x: 148, y: 14, z: 1210, r: 8, color: "#d5d8e0", kind: "moon", spin: 0.08 },
        { name: "МАРС", x: -70, y: 18, z: 1480, r: 14, color: "#d4784a", kind: "mars", spin: 0.16 },
        { name: "ЮПИТЕР", x: 180, y: -24, z: 1980, r: 52, color: "#e2b07a", kind: "jupiter", spin: 0.28 },
        { name: "САТУРН", x: -160, y: 20, z: 2520, r: 44, color: "#efd2a0", kind: "saturn", spin: 0.24, rings: true },
        { name: "УРАН", x: 140, y: -16, z: 3080, r: 26, color: "#b7e6e4", kind: "uranus", spin: 0.14 },
        { name: "НЕПТУН", x: -90, y: 12, z: 3600, r: 25, color: "#4d6ed6", kind: "neptune", spin: 0.15 },
      ];
      const ROUTES = [[0, 1], [1, 2], [2, 3], [3, 5], [5, 6], [6, 7], [7, 8], [8, 9]];
      const NAV_BOX = { minX: -280, maxX: 320, minZ: -80, maxZ: 3800 };
      const mapFix = document.getElementById("mapFix");
      const navMap = document.getElementById("navMap");
      const navCtx = navMap.getContext("2d");
      let navTarget = PLACES[3];
      let stickX = 0;
      let stickY = 0;
      let stickSX = 0; // smoothed stick
      let stickSY = 0;
      let pitchRate = 0;
      let yawRate = 0;
      let camRoll = 0; // visual bank — focus stays center, sky tilts
      let vanishSX = 0; // soft tunnel focus drift (bending tunnel)
      let vanishSY = 0;
      let yokeRotSmooth = 0;
      let yokePullSmooth = 0;
      const keys = new Set();
      let raf = 0;

      function expApproach(current, target, rate, dt) {
        return current + (target - current) * (1 - Math.exp(-rate * dt));
      }
      let prevSpeed = speed;
      let wasThrusting = false;

      // —— Engine audio ——
      // Silent until first Space/THRUST → engine start, then continuous
      let audioCtx = null;
      let masterGain = null;
      let engOsc = null;
      let engOsc2 = null;
      let engOsc3 = null;
      let engGain = null;
      let noiseNode = null;
      let noiseGain = null;
      let noiseFilter = null;
      let windGain = null;
      let shimmerGain = null;
      let shimmerOsc = null;
      let audioReady = false;
      let audioArmed = false;      // true after first Space
      let engineStarted = false;   // true after start sequence
      let audioStyle = "core";     // "core" | "galactic"
      let engVol = 0;
      let engTone = 55;
      let noiseVol = 0;
      let windVol = 0;
      let shimmerVol = 0;
      let lastAudioPush = 0;
      let appliedOscStyle = null; // only rewrite OscillatorNode.type on change
      let audioResumePending = false;
      const audioStyleBtn = document.getElementById("audioStyleBtn");
      let setGearVisual = () => {};

      function activeGear() {
        return gearPending || gear;
      }

      function requestGear(next) {
        next = String(next || "D").toUpperCase();
        if (next !== "D" && next !== "N" && next !== "R") return;

        // Tap R again while already in R → release to Neutral (stop)
        if (next === "R" && gear === "R" && !braking && !gearPending) next = "N";

        if (braking) {
          if (gearPending !== next) {
            gearPending = next;
            setGearVisual();
          }
          return;
        }
        if (next === gear) {
          setGearVisual();
          return;
        }

        if (thrusting || thrustPointer) thrustGate = true;
        thrusting = false;
        thrustPointer = false;
        if (typeof setThrustVisual === "function") setThrustVisual();

        const spdT = (speed - HOVER_SPEED) / (SPEED_MAX - HOVER_SPEED);
        if (speed > 0.2) {
          braking = true;
          gearPending = next;
          if (spdT > 0.32) {
            armAudioFromThrust();
            playEngineBrake(Math.min(1, Math.max(0, spdT)));
          }
          setGearVisual();
          return;
        }

        commitGear(next);
      }

      function commitGear(next) {
        gear = next;
        gearPending = null;
        braking = false;

        speed = 0; // hard stop after shift — no residual drift
        thrusting = false;
        thrustPointer = false;
        if (typeof setThrustVisual === "function") setThrustVisual();
        setGearVisual();
      }

      function canThrust() {
        return !braking && !thrustGate && gear !== "N";
      }

      function speedCap() {
        return gear === "R" ? SPEED_MAX_REV : SPEED_MAX;
      }

      function speedNorm() {
        if (speed <= 0.001) return 0;
        const cap = speedCap();
        return Math.max(0, Math.min(1, speed / Math.max(0.001, cap)));
      }

      function driveSpeed() {
        if (braking) return 0;
        if (gear === "R" && !thrusting && speed < 0.05) return 0;
        return Math.max(0, speed);
      }

      function ensureAudio() {
        if (audioCtx) {
          if (audioCtx.state === "suspended" && !audioResumePending) {
            audioResumePending = true;
            audioCtx.resume().finally(() => { audioResumePending = false; });
          }
          return audioCtx;
        }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.22;
        masterGain.connect(audioCtx.destination);

        engGain = audioCtx.createGain();
        engGain.gain.value = 0;
        engOsc = audioCtx.createOscillator();
        engOsc.type = "sine";
        engOsc.frequency.value = 55;
        const engFilter = audioCtx.createBiquadFilter();
        engFilter.type = "lowpass";
        engFilter.frequency.value = 420;
        engFilter.Q.value = 0.7;
        engOsc2 = audioCtx.createOscillator();
        engOsc2.type = "sine";
        engOsc2.frequency.value = 82;
        const eng2Gain = audioCtx.createGain();
        eng2Gain.gain.value = 0.35;
        engOsc3 = audioCtx.createOscillator();
        engOsc3.type = "sine";
        engOsc3.frequency.value = 110;
        const eng3Gain = audioCtx.createGain();
        eng3Gain.gain.value = 0; // used in galactic mode
        engOsc.connect(engFilter);
        engFilter.connect(engGain);
        engOsc2.connect(eng2Gain);
        eng2Gain.connect(engGain);
        engOsc3.connect(eng3Gain);
        eng3Gain.connect(engGain);
        engGain.connect(masterGain);
        engOsc.start();
        engOsc2.start();
        engOsc3.start();
        engOsc2._gain = eng2Gain;
        engOsc3._gain = eng3Gain;
        engOsc._filter = engFilter;

        const bufLen = Math.floor(audioCtx.sampleRate * 1.2);
        const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        // Pink noise: a low roar, not a hiss
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufLen; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
          b6 = white * 0.115926;
        }
        let peak = 0.001;
        for (let i = 0; i < bufLen; i++) peak = Math.max(peak, Math.abs(data[i]));
        const norm = 0.8 / peak;
        for (let i = 0; i < bufLen; i++) data[i] *= norm;
        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = buf;
        noiseNode.loop = true;
        noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = "lowpass";
        noiseFilter.frequency.value = 420;
        noiseFilter.Q.value = 0.5;
        noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0;
        windGain = audioCtx.createGain();
        windGain.gain.value = 0;
        const windFilter = audioCtx.createBiquadFilter();
        windFilter.type = "bandpass";
        windFilter.frequency.value = 1400;
        windFilter.Q.value = 0.45;
        const rushGain = audioCtx.createGain();
        rushGain.gain.value = 1;
        const rushLFO = audioCtx.createOscillator();
        rushLFO.type = "sine";
        rushLFO.frequency.value = 8;
        const rushDepth = audioCtx.createGain();
        rushDepth.gain.value = 0.12;
        rushLFO.connect(rushDepth);
        rushDepth.connect(rushGain.gain);
        noiseNode.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(rushGain);
        rushGain.connect(masterGain);
        noiseNode.connect(windFilter);
        windFilter.connect(windGain);
        windGain.connect(masterGain);
        noiseNode.start();
        rushLFO.start();
        noiseNode._windFilter = windFilter;
        noiseNode._rushLFO = rushLFO;
        noiseNode._rushDepth = rushDepth;

        // Intergalactic shimmer layer
        shimmerGain = audioCtx.createGain();
        shimmerGain.gain.value = 0;
        shimmerOsc = audioCtx.createOscillator();
        shimmerOsc.type = "sine";
        shimmerOsc.frequency.value = 220;
        const shimLFO = audioCtx.createOscillator();
        shimLFO.frequency.value = 0.15;
        const shimLFOGain = audioCtx.createGain();
        shimLFOGain.gain.value = 40;
        shimLFO.connect(shimLFOGain);
        shimLFOGain.connect(shimmerOsc.frequency);
        shimmerOsc.connect(shimmerGain);
        shimmerGain.connect(masterGain);
        shimmerOsc.start();
        shimLFO.start();
        shimmerOsc._lfo = shimLFO;

        audioReady = true;
        return audioCtx;
      }

      function playEngineStart() {
        if (!ensureAudio() || !audioReady) return;
        const t0 = audioCtx.currentTime;
        // Crank / spool-up
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const f = audioCtx.createBiquadFilter();
        o.type = "sine";
        f.type = "lowpass";
        o.connect(f); f.connect(g); g.connect(masterGain);
        o.frequency.setValueAtTime(32, t0);
        o.frequency.exponentialRampToValueAtTime(74, t0 + 0.7);
        o.frequency.exponentialRampToValueAtTime(46, t0 + 1.2);
        f.frequency.setValueAtTime(140, t0);
        f.frequency.exponentialRampToValueAtTime(520, t0 + 0.8);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.12);
        g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.7);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.25);
        o.start(t0);
        o.stop(t0 + 1.3);

        // Ignition noise burst (separate one-shot source)
        const ibuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.5), audioCtx.sampleRate);
        const idata = ibuf.getChannelData(0);
        for (let i = 0; i < idata.length; i++) idata[i] = (Math.random() * 2 - 1) * (1 - i / idata.length);
        const ign = audioCtx.createBufferSource();
        ign.buffer = ibuf;
        const ng = audioCtx.createGain();
        const nf = audioCtx.createBiquadFilter();
        nf.type = "bandpass";
        nf.frequency.value = 900;
        ign.connect(nf); nf.connect(ng); ng.connect(masterGain);
        ng.gain.setValueAtTime(0.0001, t0);
        ng.gain.exponentialRampToValueAtTime(0.08, t0 + 0.08);
        ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
        ign.start(t0);
        ign.stop(t0 + 0.55);

        setTimeout(() => { engineStarted = true; }, 900);
      }

      function armAudioFromThrust() {
        if (audioArmed) return;
        audioArmed = true;
        ensureAudio();
        playEngineStart();
      }

      function playWhoosh(rising) {
        if (!audioArmed || !audioReady || !engineStarted) return;
        try {
          const t0 = audioCtx.currentTime;
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          const f = audioCtx.createBiquadFilter();
          const gal = audioStyle === "galactic";
          o.type = "sine";
          f.type = "bandpass";
          f.Q.value = gal ? 2.2 : 4;
          o.connect(f); f.connect(g); g.connect(masterGain);
          if (rising) {
            const a = gal ? 90 : 120;
            const b = gal ? 720 : 480;
            o.frequency.setValueAtTime(a, t0);
            o.frequency.exponentialRampToValueAtTime(b, t0 + (gal ? 0.55 : 0.35));
            f.frequency.setValueAtTime(gal ? 300 : 400, t0);
            f.frequency.exponentialRampToValueAtTime(gal ? 2400 : 1800, t0 + (gal ? 0.55 : 0.35));
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(gal ? 0.1 : 0.12, t0 + 0.06);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + (gal ? 0.65 : 0.4));
            o.start(t0);
            o.stop(t0 + 0.85);
          } else {
            o.frequency.setValueAtTime(gal ? 520 : 360, t0);
            o.frequency.exponentialRampToValueAtTime(gal ? 55 : 70, t0 + (gal ? 0.8 : 0.55));
            f.frequency.setValueAtTime(gal ? 2000 : 1400, t0);
            f.frequency.exponentialRampToValueAtTime(gal ? 200 : 280, t0 + (gal ? 0.8 : 0.55));
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(0.1, t0 + 0.05);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + (gal ? 0.9 : 0.6));
            o.start(t0);
            o.stop(t0 + 1.0);
          }
        } catch (_) { /* ignore one-shot audio glitches */ }
      }

      // Engine braking rumble — used when R is hit at high speed
      function playEngineBrake(intensity) {
        if (!audioArmed) return;
        ensureAudio();
        if (!audioReady || !audioCtx) return;
        try {
          const t0 = audioCtx.currentTime;
          const dur = 0.75 + intensity * 0.85;
          const amp = 0.08 + intensity * 0.14;

          const o = audioCtx.createOscillator();
          const o2 = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          const f = audioCtx.createBiquadFilter();
          o.type = "sine";
          o2.type = "sine";
          f.type = "lowpass";
          f.Q.value = 0.9;
          o.connect(f);
          o2.connect(f);
          f.connect(g);
          g.connect(masterGain);

          const hi = 140 + intensity * 160;
          const lo = 38;
          o.frequency.setValueAtTime(hi, t0);
          o.frequency.exponentialRampToValueAtTime(lo, t0 + dur);
          o2.frequency.setValueAtTime(hi * 0.66, t0);
          o2.frequency.exponentialRampToValueAtTime(lo * 0.8, t0 + dur);
          f.frequency.setValueAtTime(900 + intensity * 700, t0);
          f.frequency.exponentialRampToValueAtTime(180, t0 + dur);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(amp, t0 + 0.05);
          g.gain.exponentialRampToValueAtTime(amp * 0.55, t0 + dur * 0.45);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          o.start(t0);
          o2.start(t0);
          o.stop(t0 + dur + 0.05);
          o2.stop(t0 + dur + 0.05);
        } catch (_) { /* ignore */ }
      }

      function updateEngineAudio(dt, spdT, thrustingNow) {
        if (!audioArmed || !audioReady) {
          prevSpeed = speed;
          wasThrusting = thrustingNow;
          return;
        }
        // Resume once — never spam .resume() from the render loop
        if (audioCtx.state === "suspended" && !audioResumePending) {
          audioResumePending = true;
          audioCtx.resume().finally(() => { audioResumePending = false; });
        }

        const accel = speed - prevSpeed;
        if (engineStarted) {
          if (thrustingNow && !wasThrusting) playWhoosh(true);
          if (!thrustingNow && wasThrusting && speed > SPEED_MIN + 0.15) playWhoosh(false);
        }
        wasThrusting = thrustingNow;

        const gal = audioStyle === "galactic";
        const startMute = engineStarted ? 1 : 0.15;
        let targetTone, targetEng, targetNoise, targetWind, targetShim;
        const brakingNow = braking;

        if (gal) {
          targetTone = 52 + spdT * 40 + (thrustingNow ? 10 : 0);
          targetEng = (0.035 + spdT * 0.06) * (thrustingNow ? 1.1 : 0.8) * startMute;
          targetNoise = (0.015 + spdT * 0.05) * startMute;
          targetWind = (0.02 + spdT * 0.07) * startMute;
          targetShim = (0.02 + spdT * 0.05 + (thrustingNow ? 0.015 : 0)) * startMute;
        } else {
          targetTone = 38 + spdT * 28 + (thrustingNow ? 14 : 0) + Math.max(0, accel) * 12;
          targetEng = (0.045 + spdT * 0.07) * (thrustingNow ? 1.25 : 0.8) * startMute;
          targetNoise = (0.03 + spdT * 0.11 + (thrustingNow ? 0.05 : 0)) * startMute;
          targetWind = (0.012 + spdT * 0.08) * startMute;
          targetShim = (0.008 + spdT * 0.02) * startMute;
        }

        if (brakingNow) {
          // Falling rumble while engine-braking into reverse/forward
          targetTone = Math.max(32, targetTone * 0.55 - 12);
          targetEng = Math.max(targetEng, (0.07 + spdT * 0.12) * startMute);
        }

        // Smooth in JS every frame; push to AudioParams sparingly
        engTone = expApproach(engTone, targetTone, brakingNow ? 10 : 6, dt);
        engVol = expApproach(engVol, targetEng, thrustingNow || brakingNow ? 8 : 3.5, dt);
        noiseVol = expApproach(noiseVol, targetNoise, 7, dt);
        windVol = expApproach(windVol, targetWind, 5, dt);
        shimmerVol = expApproach(shimmerVol, targetShim, 4, dt);

        const nowMs = performance.now();
        const styleChanged = appliedOscStyle !== audioStyle;
        if (!styleChanged && nowMs - lastAudioPush < AUDIO_PUSH_MS) {
          prevSpeed = speed;
          return;
        }
        lastAudioPush = nowMs;

        if (styleChanged) {
          appliedOscStyle = audioStyle;
          engOsc.type = "sine";
          engOsc2.type = "sine";
        }

        const t = audioCtx.currentTime;
        // Replace prior targets instead of stacking automation events
        engOsc.frequency.cancelScheduledValues(t);
        engOsc2.frequency.cancelScheduledValues(t);
        engOsc3.frequency.cancelScheduledValues(t);
        engGain.gain.cancelScheduledValues(t);
        engOsc._filter.frequency.cancelScheduledValues(t);
        noiseGain.gain.cancelScheduledValues(t);
        noiseFilter.frequency.cancelScheduledValues(t);
        windGain.gain.cancelScheduledValues(t);
        noiseNode._windFilter.frequency.cancelScheduledValues(t);
        noiseNode._rushLFO.frequency.cancelScheduledValues(t);
        noiseNode._rushDepth.gain.cancelScheduledValues(t);
        shimmerGain.gain.cancelScheduledValues(t);
        shimmerOsc.frequency.cancelScheduledValues(t);
        engOsc3._gain.gain.cancelScheduledValues(t);

        engOsc.frequency.setTargetAtTime(engTone, t, 0.05);
        engOsc2.frequency.setTargetAtTime(engTone * 1.5, t, 0.05);
        engOsc3.frequency.setTargetAtTime(engTone * 2.02, t, 0.06);
        engGain.gain.setTargetAtTime(Math.max(0, engVol), t, 0.06);
        engOsc._filter.frequency.setTargetAtTime(140 + spdT * 220 + (thrustingNow ? 80 : 0), t, 0.08);
        noiseGain.gain.setTargetAtTime(Math.max(0, noiseVol), t, 0.08);
        noiseFilter.frequency.setTargetAtTime(180 + spdT * 280 + (thrustingNow ? 90 : 0), t, 0.1);
        windGain.gain.setTargetAtTime(Math.max(0, windVol), t, 0.1);
        noiseNode._rushLFO.frequency.setTargetAtTime(5 + spdT * 11 + (thrustingNow ? 7 : 0), t, 0.12);
        noiseNode._rushDepth.gain.setTargetAtTime(0.06 + spdT * 0.2 + (thrustingNow ? 0.08 : 0), t, 0.12);
        noiseNode._windFilter.frequency.setTargetAtTime(700 + spdT * 1600, t, 0.12);
        shimmerGain.gain.setTargetAtTime(Math.max(0, shimmerVol), t, 0.1);
        shimmerOsc.frequency.setTargetAtTime(180 + spdT * 260, t, 0.12);
        engOsc3._gain.gain.setTargetAtTime(gal ? 0.45 : 0, t, 0.12);

        prevSpeed = speed;
      }

      function setAudioStyle(style) {
        audioStyle = style;
        // Force next audio push to apply oscillator waveform
        appliedOscStyle = null;
        lastAudioPush = 0;
        if (!audioStyleBtn) return;
        const gal = style === "galactic";
        audioStyleBtn.textContent = gal ? "SND · GALAX" : "SND · CORE";
        audioStyleBtn.classList.toggle("galactic", gal);
        audioStyleBtn.classList.toggle("on", gal);
      }
      if (audioStyleBtn) {
        audioStyleBtn.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          e.stopPropagation();
          setAudioStyle(audioStyle === "core" ? "galactic" : "core");
        });
      }

      function qMul(a, b) {
        return [
          a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
          a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
          a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
          a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
        ];
      }
      function qConj(q) {
        return [-q[0], -q[1], -q[2], q[3]];
      }
      function qNorm(q) {
        const n = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
        return [q[0] / n, q[1] / n, q[2] / n, q[3] / n];
      }
      function qAxisAngle(ax, ay, az, ang) {
        const h = ang * 0.5;
        const s = Math.sin(h);
        const len = Math.hypot(ax, ay, az) || 1;
        return [(ax / len) * s, (ay / len) * s, (az / len) * s, Math.cos(h)];
      }
      function qRotate(q, v) {
        const p = [v.x, v.y, v.z, 0];
        const r = qMul(qMul(q, p), qConj(q));
        return { x: r[0], y: r[1], z: r[2] };
      }
      function forwardWorld() {
        return qRotate(orient, { x: 0, y: 0, z: 1 });
      }
      function eulerFromOrient() {
        const f = forwardWorld();
        const heading = Math.atan2(f.x, f.z);
        const pitch = Math.asin(Math.max(-1, Math.min(1, -f.y)));
        return { heading, pitch };
      }

      function buildCompass() {
        const marks = [];
        for (let d = -40; d <= 400; d += 10) {
          const a = ((d % 360) + 360) % 360;
          const label = a === 0 ? "N" : a === 90 ? "E" : a === 180 ? "S" : a === 270 ? "W" : String(a).padStart(3, "0");
          const cls = (a % 90 === 0) ? "card" : "";
          marks.push(`<span class="${cls}" data-deg="${d}">${label}</span>`);
        }
        compassTape.innerHTML = marks.join("");
      }
      let compassCenter = 0;
      function updateCompass(hdgDeg) {
        // Find span for heading and center it
        const tick = 36;
        // tape starts at -40°, so offset of heading from -40 is (hdg+40)/10 * tick
        const x = compassCenter - ((hdgDeg + 40) / 10) * tick - tick / 2;
        compassTape.style.transform = `translateX(${x.toFixed(2)}px)`;
      }

      let glowGrad = null;
      let glowCx = 0, glowCy = 0, glowR = 0;
      let streakSprite = null;
      let tipSprite = null;

      function buildSprites() {
        // Soft elongated glow used as a warped streak (game particle trick)
        const sw = 256, sh = 48;
        streakSprite = document.createElement("canvas");
        streakSprite.width = sw;
        streakSprite.height = sh;
        const sctx = streakSprite.getContext("2d");
        // Build a soft tapered beam: bright tip, faded tail, soft vertical falloff
        const img = sctx.createImageData(sw, sh);
        const data = img.data;
        for (let y = 0; y < sh; y++) {
          const ny = Math.abs(y - sh / 2) / (sh / 2);
          const v = Math.pow(Math.max(0, 1 - ny), 2.2);
          for (let x = 0; x < sw; x++) {
            const nx = x / (sw - 1);
            // Tail → tip brightness; slight blue in body
            const along = Math.pow(nx, 1.45);
            const a = Math.min(0.85, v * along * 0.95);
            const i = (y * sw + x) * 4;
            data[i] = 190 + along * 50;
            data[i + 1] = 210 + along * 40;
            data[i + 2] = 255;
            data[i + 3] = Math.floor(a * 255);
          }
        }
        sctx.putImageData(img, 0, 0);

        tipSprite = document.createElement("canvas");
        tipSprite.width = 64;
        tipSprite.height = 64;
        const tctx = tipSprite.getContext("2d");
        const rg = tctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        rg.addColorStop(0, "rgba(255,255,255,1)");
        rg.addColorStop(0.2, "rgba(235,245,255,0.85)");
        rg.addColorStop(0.5, "rgba(160,200,255,0.28)");
        rg.addColorStop(1, "rgba(100,150,255,0)");
        tctx.fillStyle = rg;
        tctx.fillRect(0, 0, 64, 64);
      }

      function resize() {
        if (compassTape && compassTape.parentElement) {
          compassCenter = compassTape.parentElement.clientWidth / 2;
        }
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx = w / 2;
        cy = h * 0.42;
        glowGrad = null;
        if (!streakSprite) buildSprites();
      }

      // Frustum half-extent at a given depth (keeps the field full without wrap-jumps)
      function frustumHalf(z) {
        return (Math.max(w, h) * 0.55) * (z / FOV);
      }

      function spawnStar(z, biasX, biasY) {
        const look = starLook;
        const u = Math.random();
        const depth = z ?? (NEAR_Z + Math.pow(u, look.nearPow) * (MAX_DEPTH - NEAR_Z));
        const half = frustumHalf(depth);
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.sqrt(Math.random()) * half * 0.92;
        let x = Math.cos(angle) * radius;
        let y = Math.sin(angle) * radius;
        if (biasX || biasY) {
          x += (biasX || 0) * half * 0.06;
          y += (biasY || 0) * half * 0.05;
        }
        const tint = Math.random();
        const hot = Math.random() > 0.78;
        const r = hot ? 255 : (220 + Math.floor(tint * 35));
        const g = hot ? 250 : (230 + Math.floor((1 - tint) * 25));
        const b = 255;
        const layer = depth > MAX_DEPTH * 0.55 ? 0 : 1;
        const sz = layer === 0 ? look.sizeFar : look.sizeNear;
        return {
          x, y, z: depth,
          px: x, py: y, pz: depth,
          size: sz[0] + Math.random() * (sz[1] - sz[0]),
          r, g, b,
          bright: look.bright[0] + Math.random() * (look.bright[1] - look.bright[0]),
          layer,
        };
      }

      function init() {
        STAR_COUNT = starLook.count;
        MAX_DEPTH = starLook.maxDepth;
        stars = Array.from({ length: STAR_COUNT }, () => spawnStar());
        glowGrad = null;
      }

      function setStarLook(id) {
        const next = STAR_LOOKS[id];
        if (!next || next === starLook) return;
        starLook = next;
        init();
        document.querySelectorAll("#starLooks button").forEach((btn) => {
          const on = btn.dataset.look === id;
          btn.classList.toggle("on", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }

      // Screen radius from depth: speck at far → grow toward camera, hard-capped
      function starRadius(s, look) {
        const zSpan = Math.max(1, MAX_DEPTH - NEAR_Z);
        const t = 1 - Math.min(1, Math.max(0, (s.z - NEAR_Z) / zSpan)); // 0 far → 1 near
        const grow = Math.pow(t, look.growPow || 1.2);
        const br = s.bright || 1;
        const vary = 0.92 + (s.size || 1) * 0.08;
        const rMin = look.coreMinFar ?? 0.4;
        const rMax = look.coreMax ?? 1.35;
        return Math.min(rMax, rMin + (rMax - rMin) * grow * br * vary);
      }

      function projectCam(x, y, z, roll) {
        const zz = Math.max(NEAR_Z * 0.5, z);
        const k = FOV / zz;
        let sx = x * k;
        let sy = y * k;
        if (roll) {
          const c = Math.cos(roll), s = Math.sin(roll);
          const rx = sx * c - sy * s;
          const ry = sx * s + sy * c;
          sx = rx; sy = ry;
        }
        return { x: cx + sx, y: cy + sy, z: zz, k };
      }

      function rotX(p, a) {
        const c = Math.cos(a), s = Math.sin(a);
        return { x: p.x, y: p.y * c - p.z * s, z: p.y * s + p.z * c };
      }
      function rotY(p, a) {
        const c = Math.cos(a), s = Math.sin(a);
        return { x: p.x * c + p.z * s, y: p.y, z: -p.x * s + p.z * c };
      }

      function updateFlight(dt) {
        // Gearbox: D forward, N slow glide, R reverse
        if (braking) {
          thrusting = false;
          const spdTBrake = speed / SPEED_MAX;
          const brake = BRAKE_DECEL + Math.max(0, spdTBrake) * 2.8;
          speed = Math.max(0, speed - brake * dt);
          if (speed <= 0.04) {
            commitGear(gearPending || "N");
          }
        } else if (gear === "N") {
          reverse = false;
          thrusting = false;
          speed = expApproach(speed, NEUTRAL_DRIFT, 1.4, dt);
        } else if (gear === "R") {
          reverse = true;
          if (thrusting && canThrust()) {
            speed = Math.min(SPEED_MAX_REV, speed + ACCEL * 0.92 * dt);
          } else {
            speed = expApproach(speed, 0, 5, dt);
            if (speed < 0.03) speed = 0;
          }
        } else {
          reverse = false;
          if (thrusting && canThrust()) {
            speed = Math.min(SPEED_MAX, speed + ACCEL * dt);
          } else {
            speed = expApproach(speed, COAST, 1.5, dt);
          }
        }

        if (gear === "R" && speed > SPEED_MAX_REV) {
          speed = expApproach(speed, SPEED_MAX_REV, 4, dt);
        }

        const spdT = speedNorm();
        spdFill.style.width = `${(spdT * 100).toFixed(1)}%`;
        const gShow = activeGear();
        spdVal.textContent = (gShow === "R" ? "−" : "") + speed.toFixed(1);

        // Soft stick → ship needs time to change course
        stickSX = expApproach(stickSX, stickX, STICK_SMOOTH, dt);
        stickSY = expApproach(stickSY, stickY, STICK_SMOOTH, dt);

        // Snappier turn authority
        const turnScale = 0.95 + spdT * 0.35;
        const turn = TURN_RATE * turnScale;
        const rateSnap = RATE_SMOOTH;
        const pitchSnap = PITCH_RATE_SMOOTH;
        let targetPitch = stickSY * turn * PITCH_BOOST;
        let targetYaw = stickSX * turn;

        // Gentle hover rock when stopped (N / parked)
        hoverRockT += dt;
        const hovering = driveSpeed() < 0.05 && !braking;
        if (hovering) {
          targetPitch += Math.sin(hoverRockT * 0.95) * 0.085;
          targetYaw += Math.cos(hoverRockT * 1.2) * 0.07;
        }

        pitchRate = expApproach(pitchRate, targetPitch, pitchSnap, dt);
        yawRate = expApproach(yawRate, targetYaw, rateSnap, dt);

        if (Math.abs(pitchRate) > 1e-5) {
          orient = qNorm(qMul(orient, qAxisAngle(1, 0, 0, pitchRate * dt)));
        }
        if (Math.abs(yawRate) > 1e-5) {
          orient = qNorm(qMul(orient, qAxisAngle(0, 1, 0, yawRate * dt)));
        }

        // Stronger bank at high speed so turns read clearly
        const bankCap = BANK_MAX + Math.max(0, spdT - 0.4) * 0.18;
        let bankTarget = Math.max(-bankCap, Math.min(bankCap, -yawRate * (0.5 + spdT * 0.2)));
        if (hovering) {
          bankTarget += Math.sin(hoverRockT * 0.7) * 0.045;
        }
        camRoll = expApproach(camRoll, bankTarget, BANK_SMOOTH, dt);

        const yokeRotTarget = stickSX * 48 + (-camRoll * 38);
        const yokePullTarget = stickSY * 36;
        const ease = 1 - Math.exp(-6 * dt);
        yokeRotSmooth += (yokeRotTarget - yokeRotSmooth) * ease;
        yokePullSmooth += (yokePullTarget - yokePullSmooth) * ease;
        yoke.style.setProperty("--yoke-rot", `${yokeRotSmooth.toFixed(2)}deg`);
        yoke.style.setProperty("--yoke-pull", `${yokePullSmooth.toFixed(2)}px`);

        // Subtle cockpit lean with bank
        if (cockpitEl) {
          cockpitEl.style.transform = `rotate(${(-camRoll * 12).toFixed(2)}deg)`;
        }

        const { heading, pitch } = eulerFromOrient();
        const hdgDeg = ((heading * 180 / Math.PI) % 360 + 360) % 360;
        const pitDeg = pitch * 180 / Math.PI;
        const bankDeg = (-camRoll * 180 / Math.PI);

        hdgVal.textContent = String(Math.round(hdgDeg)).padStart(3, "0");
        pitVal.textContent = (pitDeg >= 0 ? "+" : "") + pitDeg.toFixed(0);
        bankVal.textContent = (bankDeg >= 0 ? "R" : "L") + Math.abs(bankDeg).toFixed(0);

        // Artificial horizon: nose up → more sky (ball shifts down)
        const pitchPx = Math.max(-42, Math.min(42, pitDeg * 0.55));
        adiBall.style.transform =
          `rotate(${(-camRoll).toFixed(4)}rad) translateY(${pitchPx.toFixed(2)}px)`;

        updateCompass(hdgDeg);

        // Propulsion gauges
        const thr = spdT;
        heat = expApproach(heat, thrusting ? 0.35 + thr * 0.6 : 0.1 + thr * 0.2, 1.8, dt);
        cool = expApproach(cool, thrusting ? 0.35 + (1 - thr) * 0.2 : 0.55 + (1 - thr) * 0.25, 1.6, dt);
        const arcLen = 126; // approx path length of semicircle
        thrustArc.style.strokeDashoffset = String(arcLen * (1 - thr));
        thrustPct.textContent = Math.round(thr * 100) + "%";
        barThr.style.width = (thr * 100).toFixed(1) + "%";
        barHeat.style.width = (heat * 100).toFixed(1) + "%";
        barCool.style.width = (cool * 100).toFixed(1) + "%";
        numThr.textContent = Math.round(thr * 100) + "";
        numHeat.textContent = Math.round(heat * 100) + "";
        numCool.textContent = Math.round(cool * 100) + "";
        pillThr.classList.toggle("on", thrusting || thr > 0.35);
        pillThr.classList.toggle("warn", thr > 0.85);
        pillNav.classList.toggle("on", Math.abs(yawRate) + Math.abs(pitchRate) > 0.15);

        updateEngineAudio(dt, spdT, thrusting);
        recycleField();

        if (typeof setThrustVisual === "function") setThrustVisual();

        const fwd = forwardWorld();
        const step = driveSpeed() * (reverse ? -78 : 78) * dt;
        ship.x += fwd.x * step;
        ship.y += fwd.y * step;
        ship.z += fwd.z * step;
        let near = PLACES[0], nearD = Infinity;
        for (const p of PLACES) {
          const d = Math.hypot(p.x - ship.x, p.y - ship.y, p.z - ship.z);
          if (d < nearD) { nearD = d; near = p; }
        }
        const shown = navTarget || near;
        const shownD = Math.hypot(shown.x - ship.x, shown.y - ship.y, shown.z - ship.z);
        if (mapFix) mapFix.textContent = shown.name + "  " + Math.max(0, shownD - shown.r).toFixed(0);
        poseHist.push({ x: ship.x, y: ship.y, z: ship.z, q: orient.slice(), roll: camRoll });
        if (poseHist.length > 36) poseHist.shift();
      }

      function moveStars(dt) {
        const motion = driveSpeed();
        const spdT = Math.max(0, Math.min(1, motion / SPEED_MAX));
        // Mild spin — keep tunnel focus; ship inertia does the rest
        const spin = 1 + spdT * 0.35;
        const rx = pitchRate * dt * spin;
        const ry = -yawRate * dt * spin;

        // Higher speed → faster approach → size ramps up quicker
        // Neutral / parked: zBase = 0 so we only rock, never crawl forward
        const zMul = starLook.zSpeed || 1;
        const zBase = motion * (16 + spdT * 40) * zMul * (dt * 60);
        const margin = Math.max(w, h) * 0.1;

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.px = s.x; s.py = s.y; s.pz = s.z;

          let p = { x: s.x, y: s.y, z: s.z };
          if (rx) p = rotX(p, rx);
          if (ry) p = rotY(p, ry);

        const depthFactor = 0.55 + (1 - Math.min(p.z, MAX_DEPTH) / MAX_DEPTH) * 1.45;
        if (reverse) {
          // Backing up: stars recede into the vanishing point
          p.z += zBase * depthFactor;
        } else {
          p.z -= zBase * depthFactor;
        }

        const half = frustumHalf(Math.max(p.z, NEAR_Z));
        const outFwd = !reverse && (
          p.z <= NEAR_Z ||
          Math.abs(p.x) > half * 1.7 ||
          Math.abs(p.y) > half * 1.7
        );
        const outRev = reverse && (
          p.z >= MAX_DEPTH * 0.98 ||
          Math.abs(p.x) > half * 1.7 ||
          Math.abs(p.y) > half * 1.7
        );

        if (outFwd || outRev) {
          // FWD: respawn far ahead (tiny). REV: respawn near camera, fly away
          const n = reverse
            ? spawnStar(NEAR_Z + 8 + Math.random() * 80)
            : spawnStar(MAX_DEPTH * (0.94 + Math.random() * 0.06));
          s.x = n.x; s.y = n.y; s.z = n.z;
          s.px = n.x; s.py = n.y; s.pz = n.z;
          s.size = n.size; s.r = n.r; s.g = n.g; s.b = n.b; s.bright = n.bright; s.layer = n.layer;
          s.hist = null;
          continue;
        }

        if (!reverse && p.z < MAX_DEPTH * 0.55) {
          const scr = projectCam(p.x, p.y, p.z, camRoll);
          if (
            scr.x < -margin || scr.x > w + margin ||
            scr.y < -margin || scr.y > h + margin
          ) {
            const n = spawnStar(MAX_DEPTH * (0.94 + Math.random() * 0.06));
            s.x = n.x; s.y = n.y; s.z = n.z;
            s.px = n.x; s.py = n.y; s.pz = n.z;
            s.size = n.size; s.r = n.r; s.g = n.g; s.b = n.b; s.bright = n.bright; s.layer = n.layer;
            s.hist = null;
            continue;
          }
        }

        s.x = p.x; s.y = p.y; s.z = p.z;
      }
      }

      function frame(now) {
        if (!frame.prev) frame.prev = now;
        const dt = Math.min(0.033, (now - frame.prev) / 1000);
        frame.prev = now;
        if (w < 2 || h < 2 || !canvas.width) resize();

        updateFlight(dt);

        ctx.fillStyle = "#000005";
        ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
        drawStarField();
        drawConstellations();
        drawMap();
        drawNavigator();

        raf = requestAnimationFrame(frame);
      }

      // Real asterisms. RA is shifted so Orion sits ahead at the start; the shapes stay true.
      const CONSTELLATIONS = [
        { name: "Орион", lines: [[0, 1], [0, 4], [1, 2], [2, 3], [3, 4], [1, 5], [0, 6], [5, 6]], stars: [
          ["Бетельгейзе", 5.92, 7.41], ["Беллатрикс", 5.42, 6.35], ["Минтака", 5.53, -0.30],
          ["Альнилам", 5.60, -1.20], ["Альнитак", 5.68, -1.94], ["Ригель", 5.24, -8.20], ["Саиф", 5.80, -9.67],
        ]},
        { name: "Большая Медведица", lines: [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 5], [5, 6]], stars: [
          ["Дубхе", 11.06, 61.75], ["Мерак", 11.03, 56.38], ["Фекда", 11.90, 53.69],
          ["Мегрез", 12.26, 57.03], ["Алиот", 12.90, 55.96], ["Мицар", 13.40, 54.93], ["Алькаид", 13.79, 49.31],
        ]},
        { name: "Кассиопея", lines: [[0, 1], [1, 2], [2, 3], [3, 4]], stars: [
          ["Каф", 0.15, 59.15], ["Шедар", 0.68, 56.54], ["Нави", 0.95, 60.72], ["Рукбах", 1.43, 60.24], ["Сегин", 1.91, 63.67],
        ]},
        { name: "Лебедь", lines: [[0, 1], [1, 2], [3, 1], [1, 4]], stars: [
          ["Денеб", 20.69, 45.28], ["Садр", 20.37, 40.26], ["Альбирео", 19.51, 27.96], ["Дженах", 20.77, 33.97], ["Дельта", 19.75, 45.13],
        ]},
        { name: "Скорпион", lines: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 5]], stars: [
          ["Акраб", 16.09, -19.81], ["Дшубба", 16.01, -22.62], ["Антарес", 16.49, -26.43],
          ["Тау", 16.60, -28.22], ["Шаула", 17.56, -37.10], ["Лесат", 17.51, -37.30],
        ]},
        { name: "Лев", lines: [[0, 1], [1, 2], [2, 3], [2, 4], [4, 0]], stars: [
          ["Регул", 10.14, 11.97], ["Альгиеба", 10.33, 19.84], ["Зосма", 11.24, 20.52], ["Денебола", 11.82, 14.57], ["Чертан", 11.24, 15.43],
        ]},
        { name: "Южный Крест", lines: [[0, 1], [2, 3]], stars: [
          ["Акрукс", 12.44, -63.10], ["Гакрукс", 12.52, -57.11], ["Мимоза", 12.80, -59.69], ["Дельта", 12.25, -58.75],
        ]},
        { name: "Лира", lines: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 1]], stars: [
          ["Вега", 18.62, 38.78], ["Дзета", 18.74, 37.60], ["Шелиак", 18.84, 33.36], ["Сулафат", 18.98, 32.69], ["Дельта", 18.91, 36.90],
        ]},
      ];
      function skyDir(rah, decDeg) {
        const ra = (rah - 5.6) * 15 * Math.PI / 180;
        const dec = decDeg * Math.PI / 180;
        const c = Math.cos(dec);
        return { x: c * Math.sin(ra), y: Math.sin(dec), z: c * Math.cos(ra) };
      }
      const MILKY = (() => {
        const pts = [];
        let s = 0x51a7c3;
        const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
        const tilt = 1.05;
        const ct = Math.cos(tilt), st = Math.sin(tilt);
        for (let i = 0; i < 900; i++) {
          const lon = rnd() * Math.PI * 2;
          const lat = (rnd() - 0.5) * (rnd() - 0.5) * 0.7 * (rnd() < 0.5 ? 1 : -1);
          const cl = Math.cos(lat);
          const x = cl * Math.sin(lon);
          const y0 = Math.sin(lat);
          const z0 = cl * Math.cos(lon);
          pts.push({
            x, y: y0 * ct - z0 * st, z: y0 * st + z0 * ct,
            b: 0.25 + rnd() * 0.75,
          });
        }
        return pts;
      })();
      const FIELD = (() => {
        const pts = [];
        let s = 0x9e3779b9;
        const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
        for (let i = 0; i < 2600; i++) {
          pts.push({
            x: (rnd() - 0.5) * 1100,
            y: (rnd() - 0.5) * 640,
            z: 40 + rnd() * 3600,
            r: 0.7 + rnd() * 2.6,
            warm: rnd() > 0.82,
          });
        }
        return pts;
      })();
      function recycleField() {
        const fwd = forwardWorld();
        const right = qRotate(orient, { x: 1, y: 0, z: 0 });
        const up = qRotate(orient, { x: 0, y: 1, z: 0 });
        for (let i = 0; i < FIELD.length; i++) {
          const s = FIELD[i];
          const dx = s.x - ship.x, dy = s.y - ship.y, dz = s.z - ship.z;
          const cz = dx * fwd.x + dy * fwd.y + dz * fwd.z;
          const cx = dx * right.x + dy * right.y + dz * right.z;
          const cy = dx * up.x + dy * up.y + dz * up.z;
          if (cz > 6 && cz < 3900 && Math.abs(cx) < 1400 && Math.abs(cy) < 820) continue;
          const ahead = 240 + Math.random() * 3300;
          const rx = (Math.random() - 0.5) * 1100;
          const ry = (Math.random() - 0.5) * 640;
          s.x = ship.x + fwd.x * ahead + right.x * rx + up.x * ry;
          s.y = ship.y + fwd.y * ahead + right.y * rx + up.y * ry;
          s.z = ship.z + fwd.z * ahead + right.z * rx + up.z * ry;
        }
      }
      const poseHist = [];
      const TRAIL_FROM = 1.05; // above coast (0.62) and neutral glide (0.42)
      function drawStarField() {
        const spd = driveSpeed();
        const excess = Math.max(0, spd - TRAIL_FROM);
        const trailPoses = [];
        if (excess > 0.02 && poseHist.length > 2) {
          const span = Math.min(poseHist.length, Math.round(8 + excess * 7));
          const samples = 7;
          for (let s = 0; s < samples; s++) {
            const idx = poseHist.length - 1 - Math.round(s * (span - 1) / (samples - 1));
            const pose = poseHist[Math.max(0, idx)];
            trailPoses.push({ x: pose.x, y: pose.y, z: pose.z, inv: qConj(pose.q), roll: pose.roll });
          }
        }
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (let i = 0; i < FIELD.length; i++) {
          const s = FIELD[i];
          const c = worldToCam(s);
          if (c.z < 2 || c.z > 4500) continue;
          const p = projectCam(c.x, -c.y, c.z, camRoll);
          if (p.x < -40 || p.y < -40 || p.x > w + 40 || p.y > h + 40) continue;
          const rad = Math.max(0.7, Math.min(5.5, s.r * FOV / c.z));
          if (trailPoses.length && c.z < 2800) {
            const alpha = Math.min(0.85, excess * 0.22 * Math.min(1, 1100 / c.z));
            ctx.strokeStyle = s.warm ? `rgba(255,214,160,${alpha})` : `rgba(214,228,255,${alpha})`;
            ctx.lineWidth = Math.max(0.7, rad * 0.65);
            ctx.beginPath();
            let started = false;
            for (let k = trailPoses.length - 1; k >= 0; k--) {
              const pose = trailPoses[k];
              const cam = qRotate(pose.inv, {
                x: s.x - pose.x,
                y: s.y - pose.y,
                z: s.z - pose.z,
              });
              if (cam.z < 1.5) { started = false; continue; }
              const tp = projectCam(cam.x, -cam.y, cam.z, pose.roll);
              if (!started) { ctx.moveTo(tp.x, tp.y); started = true; }
              else ctx.lineTo(tp.x, tp.y);
            }
            if (started) ctx.stroke();
          }
          ctx.fillStyle = s.warm ? "#ffe1b0" : "#eef3ff";
          ctx.beginPath();
          ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      function drawMilkyWay() {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (let i = 0; i < 8; i++) {
          const lon = i / 8 * Math.PI * 2;
          const dir = qRotate(qConj(orient), {
            x: Math.sin(lon),
            y: -Math.sin(1.05) * Math.cos(lon),
            z: Math.cos(1.05) * Math.cos(lon),
          });
          if (dir.z < 0.05) continue;
          const p = projectCam(dir.x, -dir.y, dir.z, camRoll);
          const rad = 90 + (i % 3) * 40;
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
          g.addColorStop(0, "rgba(186, 198, 255, 0.07)");
          g.addColorStop(1, "rgba(186, 198, 255, 0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "rgba(230, 236, 255, 0.85)";
        for (let i = 0; i < MILKY.length; i++) {
          const s = MILKY[i];
          const c = qRotate(qConj(orient), s);
          if (c.z < 0.05) continue;
          const p = projectCam(c.x, -c.y, c.z, camRoll);
          const sz = s.b > 0.82 ? 1.7 : 1;
          ctx.globalAlpha = 0.28 + s.b * 0.55;
          ctx.fillRect(p.x, p.y, sz, sz);
        }
        ctx.restore();
      }
      function drawConstellations() {
        ctx.save();
        ctx.lineWidth = 1.15;
        ctx.font = "12px ui-monospace, monospace";
        for (const fig of CONSTELLATIONS) {
          const cams = fig.stars.map((s) => qRotate(qConj(orient), skyDir(s[1], s[2])));
          ctx.strokeStyle = "rgba(186, 214, 255, 0.55)";
          ctx.beginPath();
          for (const [a, b] of fig.lines) {
            const ca = cams[a], cb = cams[b];
            if (ca.z < 0.12 || cb.z < 0.12) continue;
            const pa = projectCam(ca.x, -ca.y, ca.z, camRoll);
            const pb = projectCam(cb.x, -cb.y, cb.z, camRoll);
            ctx.moveTo(pa.x, pa.y);
            ctx.lineTo(pb.x, pb.y);
          }
          ctx.stroke();
          let sx = 0, sy = 0, n = 0, front = 0;
