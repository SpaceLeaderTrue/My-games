<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Север — сектор Лиры</title>
<style>
  :root {
    --ink: #e7eef8;
    --dim: rgba(210, 224, 242, 0.62);
    --line: rgba(186, 214, 255, 0.18);
    --amber: #ffc27a;
    --ice: #9ad7ff;
    --good: #8ef0c2;
    --glass: rgba(8, 12, 20, 0.46);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
  .shade {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(0,0,0,0.28) 78%, rgba(0,0,0,0.72) 100%);
  }
  .glare {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: linear-gradient(118deg, transparent 36%, rgba(255,255,255,0.035) 48%, transparent 58%);
  }
  #heat, #flash {
    position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
  }
  #heat {
    background: radial-gradient(circle at 50% 45%, rgba(255,170,70,0.05), rgba(180, 30, 0, 0.55) 80%);
    mix-blend-mode: screen;
  }
  #flash { background: rgba(255,255,255,0.7); }
  .frame {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    border: 10px solid #05070b;
    border-image: linear-gradient(#141a24, #05070b) 1;
    box-shadow: inset 0 0 0 1px rgba(190, 214, 255, 0.16), inset 0 0 80px rgba(0,0,0,0.45);
  }
  .frame::before, .frame::after {
    content: ""; position: absolute; left: 8%; right: 8%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(154,215,255,0.35), transparent);
  }
  .frame::before { top: 0; }
  .frame::after { bottom: 0; }
  #hud { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .top, .dock, .map-wrap, .log, .hint, .touch, button, #map { pointer-events: auto; }
  .top {
    position: absolute; top: max(14px, env(safe-area-inset-top)); left: 22px; right: 22px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    pointer-events: none;
  }
  .brand { letter-spacing: 0.28em; font-size: 12px; text-transform: uppercase; }
  .brand b { display: block; font-weight: 600; font-size: 15px; letter-spacing: 0.42em; }
  .brand span, .atlas { color: var(--dim); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
  .readout {
    position: absolute; left: 22px; bottom: 108px;
    text-shadow: 0 2px 16px rgba(0,0,0,0.8);
  }
  .readout .spd {
    font-variant-numeric: tabular-nums;
    font-size: clamp(42px, 6vw, 68px); line-height: 0.9; font-weight: 500; letter-spacing: -0.03em;
  }
  .readout .unit { color: var(--dim); letter-spacing: 0.22em; font-size: 11px; margin-top: 4px; }
  .readout .sub { margin-top: 10px; font-size: 13px; color: var(--ice); letter-spacing: 0.04em; }
  .readout .sub em { font-style: normal; color: var(--dim); }
  .card {
    position: absolute; right: 22px; top: 74px; width: min(260px, 42vw);
    background: var(--glass); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(10px); padding: 12px 14px 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.28);
  }
  .card h2 {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); font-weight: 500;
  }
  .card .name { font-size: 20px; margin: 4px 0 2px; }
  .card .meta { color: var(--dim); font-size: 12px; line-height: 1.45; }
  .card .meta b { color: var(--ink); font-weight: 600; }
  .match { color: var(--good); }
  .map-wrap {
    position: absolute; left: 18px; top: 62px; width: 168px; height: 168px;
    border-radius: 50%; overflow: hidden;
    border: 1px solid var(--line);
    background: rgba(5, 8, 14, 0.55);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 0 24px rgba(0,0,0,0.45);
    backdrop-filter: blur(8px);
  }
  #map { width: 100%; height: 100%; display: block; cursor: pointer; }
  .log {
    position: absolute; right: 22px; bottom: 108px; width: min(280px, 46vw);
    display: flex; flex-direction: column; gap: 4px; align-items: flex-end;
    pointer-events: none;
  }
  .log p {
    font-size: 12px; letter-spacing: 0.04em; color: rgba(232, 240, 255, 0.88);
    background: rgba(6, 10, 16, 0.4); border-radius: 999px; padding: 4px 10px;
  }
  .dock {
    position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
    width: max-content; max-width: calc(100% - 20px);
    background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
    padding: 8px; backdrop-filter: blur(12px);
  }
  button {
    appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,0.04);
    color: var(--ink); border-radius: 11px; padding: 8px 10px; cursor: pointer;
    font: inherit; letter-spacing: 0.08em; text-transform: uppercase; font-size: 11px;
  }
  button.on { border-color: rgba(154, 215, 255, 0.7); color: var(--ice); background: rgba(120, 180, 255, 0.12); }
  button.warn { color: var(--amber); }
  button:active { transform: translateY(1px); }
  .throttle {
    width: 34px; height: 54px; border-radius: 10px; border: 1px solid var(--line);
    position: relative; overflow: hidden; background: rgba(0,0,0,0.35);
  }
  .throttle i {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
    background: linear-gradient(#d7ecff, #6aa7ff);
  }
  .boost {
    width: 34px; height: 54px; border-radius: 10px; border: 1px solid var(--line);
    position: relative; overflow: hidden; background: rgba(0,0,0,0.35);
  }
  .boost i {
    position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
    background: linear-gradient(#ffe0b0, #ff9d4a);
  }
  .hint {
    position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%);
    pointer-events: none; text-align: center; letter-spacing: 0.16em;
    text-transform: uppercase; font-size: 12px; color: rgba(255,255,255,0.82);
    text-shadow: 0 2px 12px #000; transition: opacity 0.6s ease;
  }
  .titlecard {
    position: absolute; inset: 0; z-index: 7; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; pointer-events: none;
    background: radial-gradient(circle at 50% 40%, rgba(8,12,20,0.2), rgba(0,0,0,0.55));
    transition: opacity 1.4s ease;
  }
  .titlecard b { font-weight: 500; letter-spacing: 0.62em; font-size: clamp(28px, 6vw, 54px); }
  .titlecard span { letter-spacing: 0.38em; text-transform: uppercase; color: var(--dim); font-size: 12px; }
  .touch {
    display: none; position: absolute; z-index: 6;
  }
  .stick {
    left: max(16px, env(safe-area-inset-left)); bottom: 96px;
    width: 108px; height: 108px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(8,12,20,0.35);
  }
  .stick i {
    position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; border-radius: 50%;
    transform: translate(-50%, -50%); background: rgba(200, 220, 255, 0.22);
    border: 1px solid rgba(255,255,255,0.2);
  }
  .keys { position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%); color: var(--dim); font-size: 11px; letter-spacing: 0.08em; pointer-events: none; white-space: nowrap; }
  @media (pointer: coarse), (max-width: 820px) {
    .keys { display: none; }
    .touch.stick { display: block; }
    .card { display: none; }
    .readout { bottom: 168px; }
    .log { display: none; }
    .map-wrap { width: 112px; height: 112px; top: 52px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="shade"></div>
<div class="glare"></div>
<div id="heat"></div>
<div id="flash"></div>
<div class="frame"></div>
<div class="titlecard" id="title"><b>СЕВЕР</b><span>сектор Лиры</span></div>
<div id="hud">
  <div class="top">
    <div class="brand"><b>Север</b><span>катер дальнего хода</span></div>
    <div class="atlas" id="atlas">атлас 0/6</div>
  </div>
  <div class="map-wrap" title="Карта сектора. Нажми на тело, чтобы взять курс."><canvas id="map"></canvas></div>
  <div class="readout">
    <div class="spd" id="spd">0.0</div>
    <div class="unit">КМ/С</div>
    <div class="sub" id="near">свободный ход</div>
  </div>
  <div class="card" id="card">
    <h2 id="cardKind">курс</h2>
    <div class="name" id="cardName">—</div>
    <div class="meta" id="cardMeta">Выбери цель на карте слева.</div>
  </div>
  <div class="log" id="log"></div>
  <div class="keys" id="keys">мышь — курс · W/S тяга · Shift форсаж · R тормоз · F помощник · G проград</div>
  <div class="hint" id="hint"></div>
  <div class="dock">
    <div class="throttle" title="Тяга"><i id="thrFill"></i></div>
    <div class="boost" title="Форсаж"><i id="boostFill"></i></div>
    <button id="btnThrottleUp" type="button">тяга +</button>
    <button id="btnThrottleDn" type="button">тяга −</button>
    <button id="btnBoost" class="warn" type="button">форсаж</button>
    <button id="btnRetro" type="button">тормоз</button>
    <button id="btnAssist" type="button">помощник</button>
    <button id="btnPro" type="button">проград</button>
    <button id="btnMute" type="button">звук</button>
  </div>
  <div class="touch stick" id="stick"><i id="knob"></i></div>
</div>
<script>
(() => {
  const TAU = Math.PI * 2;
  const GM_STAR = 800000;
  const STAR_R = 118;
  const DT = 1 / 120;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const len3 = (v) => Math.hypot(v[0], v[1], v[2]);
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (a) => { const l = len3(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  function mulberry32(a) {
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function quatMul(a, b) {
    return [
      a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
      a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
      a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
      a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
    ];
  }
  function quatNorm(q) {
    const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
    return [q[0] / l, q[1] / l, q[2] / l, q[3] / l];
  }
  function rotateVec(q, v) {
    const u = [q[0], q[1], q[2]], s = q[3];
    const uv = cross(u, v), uuv = cross(u, uv);
    return [v[0] + 2 * (s * uv[0] + uuv[0]), v[1] + 2 * (s * uv[1] + uuv[1]), v[2] + 2 * (s * uv[2] + uuv[2])];
  }
  function quatFromAxes(x, y, z) {
    const m00 = x[0], m01 = y[0], m02 = z[0];
    const m10 = x[1], m11 = y[1], m12 = z[1];
    const m20 = x[2], m21 = y[2], m22 = z[2];
    const tr = m00 + m11 + m22;
    let q;
    if (tr > 0) {
      const s = Math.sqrt(tr + 1) * 2;
      q = [(m21 - m12) / s, (m02 - m20) / s, (m10 - m01) / s, 0.25 * s];
    } else if (m00 > m11 && m00 > m22) {
      const s = Math.sqrt(1 + m00 - m11 - m22) * 2;
      q = [0.25 * s, (m01 + m10) / s, (m02 + m20) / s, (m21 - m12) / s];
    } else if (m11 > m22) {
      const s = Math.sqrt(1 + m11 - m00 - m22) * 2;
      q = [(m01 + m10) / s, 0.25 * s, (m12 + m21) / s, (m02 - m20) / s];
    } else {
      const s = Math.sqrt(1 + m22 - m00 - m11) * 2;
      q = [(m02 + m20) / s, (m12 + m21) / s, 0.25 * s, (m10 - m01) / s];
    }
    return quatNorm(q);
  }

  const rng = mulberry32(0x51A7);
  const planets = [
    { id: "ugol", name: "Уголь", orbit: 430, radius: 48, inc: 0.05, phase: 1.1, gm: 26000, soi: 260, land: true, kind: "rock",
      lit: "#ffb089", mid: "#c25a3a", dark: "#2a120e", spin: 0.4 },
    { id: "lazur", name: "Лазурь", orbit: 980, radius: 78, inc: 0.012, phase: 0.45, gm: 52000, soi: 460, land: true, kind: "terra",
      lit: "#d8f4ff", mid: "#2f78c8", dark: "#071426", spin: 0.25 },
    { id: "yantar", name: "Янтарь", orbit: 1760, radius: 156, inc: 0.03, phase: 2.35, gm: 420000, soi: 900, land: false, kind: "gas",
      lit: "#fff1c4", mid: "#e39a45", dark: "#6a3a16", spin: 0.8, rings: [1.55, 2.45] },
    { id: "iney", name: "Иней", orbit: 2680, radius: 66, inc: 0.09, phase: 0.15, gm: 38000, soi: 420, land: true, kind: "ice",
      lit: "#ffffff", mid: "#b9e7f2", dark: "#385868", spin: 0.15 },
  ];
  const moons = [
    { id: "pena", name: "Пена", parent: "lazur", orbit: 168, radius: 16, inc: 0.55, phase: 0.4, gm: 1600, soi: 70, land: true, kind: "moon",
      lit: "#ffffff", mid: "#d5d8e4", dark: "#3a3e4e", spin: 0.2 },
    { id: "iskra", name: "Искра", parent: "yantar", orbit: 340, radius: 22, inc: 0.3, phase: 2.1, gm: 2800, soi: 90, land: true, kind: "moon",
      lit: "#ffe7c2", mid: "#c9845a", dark: "#3a2418", spin: 0.3 },
  ];
  const FORMS = {
    swan: { name: "Лебедь", stars: [[0, 0.2, 0], [0, 1.1, 0.1], [0.15, 2.0, 0], [-1.35, 1.05, 0], [1.3, 0.95, 0.1], [0.05, -0.7, 0.3], [0.1, -1.55, 0.55]], lines: [[2, 1], [1, 0], [0, 5], [5, 6], [3, 0], [0, 4]] },
    crown: { name: "Корона", stars: [[-1.4, 0, 0], [-0.7, 0.7, 0.1], [0, 1.05, 0], [0.75, 0.65, -0.1], [1.4, 0.05, 0], [-0.9, -0.45, 0.2], [0.95, -0.4, 0.15]], lines: [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [4, 6]] },
    lyre: { name: "Лира", stars: [[0, 0.15, 0], [-0.7, 0.8, 0], [0.75, 0.75, 0.1], [-0.45, -0.7, 0], [0.5, -0.65, -0.1]], lines: [[1, 2], [2, 4], [4, 3], [3, 1], [1, 0], [2, 0]] },
    arrow: { name: "Стрела", stars: [[-1.5, 0, 0], [-0.4, 0.05, 0], [0.7, 0, 0.05], [1.45, 0.05, 0], [0.55, 0.55, 0], [0.55, -0.5, 0.05]], lines: [[0, 1], [1, 2], [2, 3], [2, 4], [2, 5]] },
    cup: { name: "Чаша", stars: [[-0.9, 0.2, 0], [-0.45, 0.85, 0.1], [0.5, 0.8, 0], [0.95, 0.15, -0.05], [-0.35, -0.55, 0.1], [0.4, -0.6, 0], [0, -1.25, 0.2]], lines: [[0, 1], [1, 2], [2, 3], [3, 0], [0, 4], [3, 5], [4, 6], [5, 6]] },
    whale: { name: "Кит", stars: [[-1.7, 0.2, 0], [-0.9, 0.7, 0.15], [-0.1, 0.15, 0], [0.7, 0.55, -0.1], [1.45, -0.1, 0.1], [0.2, -0.7, 0.2], [-0.8, -0.45, 0]], lines: [[0, 1], [1, 2], [2, 3], [3, 4], [2, 5], [5, 6], [6, 0]] },
  };
  const placements = [
    ["lyre", [520, 1500, 260], 210],
    ["swan", [-2600, 700, 1800], 280],
    ["crown", [2400, 1100, -1900], 260],
    ["arrow", [-1800, -400, -2400], 230],
    ["cup", [3100, 400, 1200], 250],
    ["whale", [-900, 1800, -2800], 300],
  ];
  const constellations = placements.map(([key, at, scale]) => {
    const form = FORMS[key];
    const stars = form.stars.map((p, i) => ({
      name: i === 0 ? form.name : "",
      pos: [at[0] + p[0] * scale, at[1] + p[1] * scale, at[2] + p[2] * scale],
      bright: i === 0 ? 1 : 0.7,
    }));
    const center = [0, 0, 0];
    stars.forEach((s) => { center[0] += s.pos[0]; center[1] += s.pos[1]; center[2] += s.pos[2]; });
    center[0] /= stars.length; center[1] /= stars.length; center[2] /= stars.length;
    return { id: key, name: form.name, stars, lines: form.lines, center, charted: false, progress: 0 };
  });
  const heroStars = constellations.flatMap((c) => c.stars);

  const asteroids = [];
  for (let i = 0; i < 72; i++) {
    const a = rng() * TAU;
    const orbit = 1280 + rng() * 180;
    const y = (rng() - 0.5) * 80;
    const rad = 3 + rng() * 8;
    const verts = [];
    const n = 6 + (rng() * 3 | 0);
    for (let k = 0; k < n; k++) verts.push(0.55 + rng() * 0.5);
    const sp = Math.sqrt(GM_STAR / orbit);
    asteroids.push({
      id: "ast" + i, name: "Обломок", kind: "asteroid", radius: rad, gm: 0, soi: 0, land: false,
      ang: a, orbit, y, n: sp / orbit,
      pos: [Math.cos(a) * orbit, y, Math.sin(a) * orbit],
      vel: [-Math.sin(a) * sp, 0, Math.cos(a) * sp],
      spin: rng() * TAU, spinRate: (rng() - 0.5) * 0.8, verts,
      color: rng() > 0.7 ? "#8a5a45" : "#9aa3ad",
    });
  }

  const comet = {
    id: "comet", name: "Нить", kind: "comet", radius: 7, gm: 0, soi: 40, land: false,
    a: 2400, e: 0.78, inc: 0.42, peri: 0.9, M0: 0.4,
    pos: [0, 0, 0], vel: [0, 0, 0],
  };

  const nebulae = [
    { pos: [1400, 800, -900], color: "120, 90, 255", r: 900 },
    { pos: [-600, -200, 1600], color: "255, 140, 80", r: 700 },
    { pos: [2200, 200, 2100], color: "80, 180, 255", r: 800 },
  ];

  const sky = [];
  for (let i = 0; i < 1600; i++) {
    const z = 1 - rng() * 2;
    const lat = Math.asin(clamp(z, -1, 1));
    const lon = rng() * TAU;
    const band = Math.exp(-Math.pow(lat / 0.28, 2));
    const inBand = rng() < 0.55 + band * 0.4;
    const mag = inBand ? rng() * rng() : rng();
    const rr = 18000 + rng() * 4000;
    const clat = Math.cos(lat);
    sky.push({
      pos: [clat * Math.cos(lon) * rr, Math.sin(lat) * rr, clat * Math.sin(lon) * rr],
      mag, band: inBand,
      hue: rng(),
    });
  }

  const bodies = [];
  function keplerCircle(body, t, origin, originVel) {
    const n = Math.sqrt((body.parentGm || GM_STAR) / Math.pow(body.orbit, 3));
    const th = n * t + body.phase;
    const c = Math.cos(th), s = Math.sin(th);
    const ci = Math.cos(body.inc), si = Math.sin(body.inc);
    const x = body.orbit * c;
    const y = body.orbit * s * si;
    const z = body.orbit * s * ci;
    const vx = -body.orbit * s * n;
    const vy = body.orbit * c * n * si;
    const vz = body.orbit * c * n * ci;
    body.pos = origin ? [origin[0] + x, origin[1] + y, origin[2] + z] : [x, y, z];
    body.vel = originVel ? [originVel[0] + vx, originVel[1] + vy, originVel[2] + vz] : [vx, vy, vz];
  }
  function updateComet(t) {
    const n = Math.sqrt(GM_STAR / Math.pow(comet.a, 3));
    const M = n * t + comet.M0;
    let E = M;

    }
  }

  function fmt(d) {
    const a = Math.abs(d);
    if (a < 1000) return a.toFixed(0) + " км";
    return (a / 1000).toFixed(a < 10000 ? 1 : 0) + " тыс. км";
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    const warm = clamp(1 - len3(ship.p) / 1400, 0, 1) * 0.5 + ship.heat * 0.5;
    g.addColorStop(0, warm > 0.2 ? "#1a0e14" : "#070814");
    g.addColorStop(0.55, "#0b1020");
    g.addColorStop(1, "#05060c");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = "lighter";
    for (const n of nebulae) {
      const pr = project(n.pos);
      if (!pr.ok) continue;
      const rad = n.r * pr.s;
      if (rad < 20 || rad > 3000) continue;
      const ng = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, rad);
      ng.addColorStop(0, `rgba(${n.color},0.16)`);
      ng.addColorStop(1, `rgba(${n.color},0)`);
      ctx.fillStyle = ng;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, rad, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    const speed = len3(ship.v);
    const stretch = reduced ? 0 : clamp((speed - 28) / 90, 0, 1);
    for (const s of sky) {
      const p = project(s.pos);
      if (!p.ok) continue;
      const tw = 0.75 + 0.25 * Math.sin(simTime * (1.5 + s.hue * 3) + s.pos[0]);
      const alpha = (0.15 + s.mag * 0.85) * tw * (s.band ? 1 : 0.75);
      const size = s.mag > 0.92 ? 1.8 : s.mag > 0.7 ? 1.3 : 1;
      if (stretch > 0.15 && s.mag > 0.4) {
        const back = project(sub(s.pos, mul(ship.v, stretch * 0.8)));
        if (back.ok) {
          ctx.strokeStyle = `rgba(226,236,255,${alpha * stretch})`;
          ctx.lineWidth = size;
          ctx.beginPath(); ctx.moveTo(back.x, back.y); ctx.lineTo(p.x, p.y); ctx.stroke();
          continue;
        }
      }
      ctx.fillStyle = s.hue > 0.85 ? `rgba(255,196,150,${alpha})` : s.hue < 0.08 ? `rgba(160,190,255,${alpha})` : `rgba(236,242,255,${alpha})`;
      ctx.fillRect(p.x, p.y, size, size);
    }
  }

  function drawConstellations() {
    ctx.lineWidth = 1;
    for (const c of constellations) {
      const hot = c.charted ? 0.85 : 0.22 + c.progress * 0.5;
      ctx.strokeStyle = c.charted ? `rgba(255, 206, 140, ${hot})` : `rgba(170, 200, 255, ${hot})`;
      ctx.beginPath();
      for (const [a, b] of c.lines) {
        const pa = project(c.stars[a].pos), pb = project(c.stars[b].pos);
        if (!pa.ok || !pb.ok) continue;
        ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
      }
      ctx.stroke();
      for (const s of c.stars) {
        const p = project(s.pos);
        if (!p.ok) continue;
        const rad = Math.max(1.4, 18 * p.s);
        ctx.fillStyle = c.charted ? "#ffe1b0" : "#d5e6ff";
        ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, TAU); ctx.fill();
        if (s.bright > 0.9) spike(p.x, p.y, rad * 5, c.charted ? "rgba(255,210,150,0.8)" : "rgba(200,220,255,0.55)");
      }
      if (c.charted || c.progress > 0.05) {
        const p = project(c.center);
        if (p.ok && p.z < 5000) {
          ctx.fillStyle = "rgba(255,255,255,0.8)";
          ctx.font = "12px sans-serif";
          ctx.fillText(c.name, p.x + 10, p.y - 10);
        }
      }
    }
  }
  function spike(x, y, len, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - len, y); ctx.lineTo(x + len, y);
    ctx.moveTo(x, y - len); ctx.lineTo(x, y + len);
    ctx.stroke();
  }

  function drawPlanet(b) {
    const p = project(b.pos);
    if (!p.ok) return;
    const r = Math.max(0.8, b.radius * p.s);
    if (r < 1.2 && b.kind !== "star") {
      ctx.fillStyle = "#fff"; ctx.fillRect(p.x, p.y, 2, 2); return;
    }
    const light = norm(mul(b.pos, -1));
    const lx = p.x + (light[0] * right[0] + light[1] * right[1] + light[2] * right[2]) * r * 0.55;
    const ly = p.y - (light[0] * up[0] + light[1] * up[1] + light[2] * up[2]) * r * 0.55;
    if (b.rings) drawRing(b, p, r, true);
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.clip();
    const g = ctx.createRadialGradient(lx, ly, r * 0.1, p.x, p.y, r * 1.15);
    g.addColorStop(0, b.lit); g.addColorStop(0.45, b.mid); g.addColorStop(1, b.dark);
    ctx.fillStyle = g; ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2);
    if (b.kind === "gas" || b.kind === "ice" || b.kind === "terra") {
      for (let i = -3; i <= 3; i++) {
        const yy = p.y + (i / 4) * r + Math.sin(simTime * b.spin + i) * r * 0.04;
        ctx.fillStyle = `rgba(255,255,255,${b.kind === "gas" ? 0.08 : 0.05})`;
        ctx.fillRect(p.x - r, yy, r * 2, r * 0.09);
      }
    }
    if (b.kind === "terra") {
      ctx.fillStyle = "rgba(255, 220, 140, 0.85)";
      const seed = 3;
      for (let i = 0; i < 18; i++) {
        const fx = Math.sin(i * 12.3 + seed) * 0.7;
        const fy = Math.cos(i * 4.1 + seed) * 0.7;
        if (fx * fx + fy * fy > 0.8) continue;
        const illum = (lx - p.x) * fx + (ly - p.y) * fy;
        if (illum > 0) continue;
        ctx.fillRect(p.x + fx * r, p.y + fy * r, 1.6, 1.6);
      }
    }
    const spec = ctx.createRadialGradient(lx, ly, 0, lx, ly, r * 0.45);
    spec.addColorStop(0, "rgba(255,255,255,0.55)"); spec.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = spec; ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2);
    ctx.restore();
    const atmo = ctx.createRadialGradient(p.x, p.y, r * 0.9, p.x, p.y, r * 1.25);
    atmo.addColorStop(0, "rgba(160,200,255,0)");
    atmo.addColorStop(1, b.kind === "rock" ? "rgba(255,120,60,0.18)" : "rgba(160,210,255,0.22)");
    ctx.fillStyle = atmo; ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.25, 0, TAU); ctx.fill();
    if (b.rings) drawRing(b, p, r, false);
    if (r > 16) {
      ctx.fillStyle = "rgba(255,255,255,0.86)";
      ctx.font = "12px sans-serif";
      ctx.fillText(b.name, p.x + r + 8, p.y);
    }
  }
  function drawRing(b, p, r, back) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(1, 0.38);
    ctx.beginPath();
    ctx.arc(0, 0, r * b.rings[1], 0, TAU);
    ctx.arc(0, 0, r * b.rings[0], 0, TAU, true);
    ctx.clip();
    ctx.fillStyle = back ? "rgba(230, 200, 150, 0.18)" : "rgba(255, 226, 180, 0.38)";
    ctx.fillRect(-r * 3, back ? -r * 3 : 0, r * 6, r * 3);
    ctx.restore();
  }
  function drawStar() {
    const p = project([0, 0, 0]);
    if (!p.ok) return;
    const r = Math.max(2, STAR_R * p.s);
    const glow = ctx.createRadialGradient(p.x, p.y, r * 0.2, p.x, p.y, r * 5);
    glow.addColorStop(0, "rgba(255,244,220,0.95)");
    glow.addColorStop(0.18, "rgba(255,200,120,0.45)");
    glow.addColorStop(1, "rgba(255,140,40,0)");
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 5, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#fff6df";
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
    spike(p.x, p.y, r * 6, "rgba(255,230,190,0.7)");
    if (p.x > 0 && p.x < w && p.y > 0 && p.y < h) {
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "rgba(255,220,170,0.18)";
      ctx.beginPath(); ctx.arc(p.x + 80, p.y + 30, r * 0.6, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + (p.x - cx) * 0.3, cy + (p.y - cy) * 0.3, 10, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
  }
  function drawAsteroid(a) {
    const p = project(a.pos);
    if (!p.ok) return;
    const r = Math.max(1, a.radius * p.s);
    if (r < 1) { ctx.fillStyle = "#bbb"; ctx.fillRect(p.x, p.y, 1.4, 1.4); return; }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(a.spin);
    ctx.beginPath();
    a.verts.forEach((v, i) => {
      const ang = (i / a.verts.length) * TAU;
      const x = Math.cos(ang) * r * v, y = Math.sin(ang) * r * v;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = a.color; ctx.fill();
    ctx.restore();
  }
  function drawComet() {
    const sun = norm(mul(comet.pos, -1));
    ctx.globalCompositeOperation = "lighter";
    for (let i = 1; i <= 22; i++) {
      const t = i / 22;
      const wob = Math.sin(simTime * 3 + i) * 18 * t;
      const side = [-sun[2], 0, sun[0]];
      const pos = add(add(comet.pos, mul(sun, -t * 420)), mul(side, wob));
      const p = project(pos);
      if (!p.ok) continue;
      ctx.fillStyle = `rgba(190, 230, 255, ${0.28 * (1 - t)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, (8 - t * 6) * p.s * 40), 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    const p = project(comet.pos);
    if (!p.ok) return;
    ctx.fillStyle = "#f4fbff";
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(2, comet.radius * p.s), 0, TAU); ctx.fill();
    if (p.z < 4000) { ctx.fillStyle = "#fff"; ctx.font = "12px sans-serif"; ctx.fillText("Нить", p.x + 8, p.y - 8); }
  }
  function drawMotes() {
    ctx.fillStyle = "rgba(230, 245, 255, 0.8)";
    for (const m of motes) {
      const p = project(m.p);
      if (!p.ok) continue;
      ctx.globalAlpha = clamp(m.life, 0, 1);
      ctx.fillRect(p.x, p.y, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  function drawPredict() {
    if (ship.landed) return;
    let p = ship.p.slice(), v = ship.v.slice();
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < 36; i++) {
      const a = gravityAt(p);
      v = add(v, mul(a, 0.22));
      p = add(p, mul(v, 0.22));
      const pr = project(p);
      if (!pr.ok) { started = false; continue; }
      if (!started) { ctx.moveTo(pr.x, pr.y); started = true; }
      else ctx.lineTo(pr.x, pr.y);
    }
    ctx.strokeStyle = "rgba(142, 240, 194, 0.55)";
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }
  function drawMarker(world, color, label) {
    const d = sub(world, ship.p);
    const x = dot(d, right), y = dot(d, up), z = dot(d, fwd);
    let sx, sy, on = false;
    if (z > 1) {
      const s = focal / z;
      sx = cx + x * s; sy = cy - y * s;
      on = sx > 24 && sx < w - 24 && sy > 24 && sy < h - 24;
    }
    if (!on) {
      let ix = x, iy = y;
      if (z < 0) { ix = -ix; iy = -iy; }
      const ang = Math.atan2(iy, ix);
      sx = cx + Math.cos(ang) * Math.min(w, h) * 0.38;
      sy = cy - Math.sin(ang) * Math.min(w, h) * 0.32;
    }
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(sx, sy, on ? 5 : 4, 0, TAU); ctx.stroke();
    if (!on) {
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 8, sy); ctx.stroke();
    }
    if (label) { ctx.font = "11px sans-serif"; ctx.fillText(label, sx + 8, sy - 8); }
  }
  function reticle() {
    ctx.strokeStyle = "rgba(255,255,255,0.8)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, 11, 0, TAU);
    ctx.moveTo(cx - 18, cy); ctx.lineTo(cx - 7, cy);
    ctx.moveTo(cx + 7, cy); ctx.lineTo(cx + 18, cy);
    ctx.moveTo(cx, cy - 18); ctx.lineTo(cx, cy - 7);
    ctx.moveTo(cx, cy + 7); ctx.lineTo(cx, cy + 18);
    ctx.stroke();
    if (ship.locking) {
      const a = ship.locking.progress * TAU;
      ctx.strokeStyle = "#ffc27a";
      ctx.beginPath(); ctx.arc(cx, cy, 20, -Math.PI / 2, -Math.PI / 2 + a); ctx.stroke();
    }
  }

  function render() {
    basis();
    drawSky();
    drawConstellations();
    const drawables = [{ kind: "star", pos: [0, 0, 0] }, ...planets, ...moons, ...asteroids];
    drawables.sort((a, b) => len3(sub(b.pos, ship.p)) - len3(sub(a.pos, ship.p)));
    for (const b of drawables) {
      if (b.kind === "star") drawStar();
      else if (b.kind === "asteroid") drawAsteroid(b);
      else drawPlanet(b);
    }
    drawComet();
    drawMotes();
    drawPredict();
    if (len3(ship.v) > 2) drawMarker(add(ship.p, norm(ship.v)), "#8ef0c2", "");
    if (target) {
      drawMarker(target.pos, "#ffc27a", target._label || target.name || "");
      const p = project(target.pos);
      if (p.ok) {
        const rr = Math.max(16, (target.radius || 20) * p.s + 10);
        ctx.strokeStyle = "rgba(255,194,122,0.9)";
        ctx.strokeRect(p.x - rr, p.y - rr, rr * 2, rr * 2);
      }
    }
    reticle();
  }

  function drawMap() {
    const s = map.clientWidth;
    const c = s / 2;
    const scale = (s * 0.42) / 2800;
    mctx.clearRect(0, 0, s, s);
    mctx.strokeStyle = "rgba(180,200,230,0.25)";
    mctx.lineWidth = 1;
    for (const p of planets) {
      mctx.beginPath(); mctx.arc(c, c, p.orbit * scale, 0, TAU); mctx.stroke();
    }
    mctx.fillStyle = "#ffe1a8";
    mctx.beginPath(); mctx.arc(c, c, 3.5, 0, TAU); mctx.fill();
    const paint = (b, color, rad) => {
      mctx.fillStyle = color;
      mctx.beginPath();
      mctx.arc(c + b.pos[0] * scale, c + b.pos[2] * scale, rad, 0, TAU);
      mctx.fill();
    };
    planets.forEach((p) => paint(p, p.mid, p.id === "yantar" ? 4.5 : 3.2));
    moons.forEach((m) => paint(m, "#ddd", 2));
    paint(comet, "#9ad7ff", 2);
    mctx.save();
    mctx.translate(c + ship.p[0] * scale, c + ship.p[2] * scale);
    mctx.rotate(Math.atan2(fwd[2], fwd[0]));
    mctx.fillStyle = "#fff";
    mctx.beginPath(); mctx.moveTo(6, 0); mctx.lineTo(-4, 3.5); mctx.lineTo(-4, -3.5); mctx.closePath(); mctx.fill();
    mctx.restore();
    mctx.strokeStyle = "rgba(255,255,255,0.35)";
    for (const cn of constellations) {
      const d = norm(cn.center);
      mctx.beginPath();
      mctx.moveTo(c + d[0] * s * 0.44, c + d[2] * s * 0.44);
      mctx.lineTo(c + d[0] * s * 0.48, c + d[2] * s * 0.48);
      mctx.stroke();
    }
  }

  function hud() {
    const speed = len3(ship.landed ? [0, 0, 0] : sub(ship.v, ship.landed ? ship.landed.vel : [0, 0, 0]));
    const spd = ship.landed ? 0 : len3(ship.v);
    document.getElementById("spd").textContent = spd.toFixed(1);
    document.getElementById("thrFill").style.height = (ship.throttle * 100) + "%";
    document.getElementById("boostFill").style.height = (ship.boost * 100) + "%";
    document.getElementById("atlas").textContent = "атлас " + charted.size + "/6";
    const near = ship.near;
    let line = ship.landed ? "на поверхности · " + ship.landed.name : "свободный ход";
    if (!ship.landed && near) {
      const dist = len3(sub(ship.p, near.pos));
      const alt = dist - near.radius;
      line = near.name + " · " + fmt(alt);
      if (near.gm && alt < near.soi) {
        const vRel = len3(sub(ship.v, near.vel));
        const vCirc = Math.sqrt(near.gm / Math.max(dist, near.radius + 1));
        const close = Math.abs(vRel - vCirc) / vCirc < 0.12;
        line += close ? " · орбита близко" : " · круговая " + vCirc.toFixed(0);
      }
    }
    const nearEl = document.getElementById("near");
    nearEl.className = "sub" + (line.includes("орбита близко") ? " match" : "");
    nearEl.textContent = line;
    const cardName = document.getElementById("cardName");
    const cardMeta = document.getElementById("cardMeta");
    const cardKind = document.getElementById("cardKind");
    if (ship.landed) {
      cardKind.textContent = "поверхность";
      cardName.textContent = ship.landed.name;
      cardMeta.innerHTML = "Тяга больше четверти — и катер снова в небе.";
    } else if (target) {
      const d = len3(sub(target.pos, ship.p));
      const vr = target.vel ? len3(sub(ship.v, target.vel)) : len3(ship.v);
      cardKind.textContent = "цель";
      cardName.textContent = target._label || target.name || "курс";
      cardMeta.innerHTML = fmt(d) + "<br>сближение <b>" + vr.toFixed(0) + "</b> км/с";
    } else if (near) {
      cardKind.textContent = "рядом";
      cardName.textContent = near.name;
      cardMeta.textContent = near.kind === "gas" ? "Тяжёлый колодец. Зайди сзади по ходу — и он добавит скорости." : "Скорость около круговой держит высоту без тяги.";
    }
    const logEl = document.getElementById("log");
    logEl.innerHTML = logs.map((l) => `<p>${l.text}</p>`).join("");
    document.getElementById("heat").style.opacity = ship.heat * 0.85;
    document.getElementById("flash").style.opacity = ship.flash * 0.55;
    const acc = ship._acc || [0, 0, 0];
    const gx = clamp(dot(acc, right) * 0.15, -12, 12);
    const gy = clamp(dot(acc, up) * 0.15, -12, 12);
    if (!reduced) document.getElementById("hud").style.transform = `translate(${-gx}px, ${gy}px)`;
    if (audioCtx && engineGain && !muted) {
      const now = audioCtx.currentTime;
      const drive = ship.landed ? 0.04 : ship.throttle;
      const boost = ship.boost < 0.98 && (keys.has("ShiftLeft") || hold.boost) ? 0.25 : 0;
      engineGain.gain.setTargetAtTime(0.02 + drive * 0.22 + boost, now, 0.08);
      engineFilter.frequency.setTargetAtTime(140 + drive * 700 + spd * 2, now, 0.08);
      engineGain._tone.gain.setTargetAtTime(drive * 0.12 + boost, now, 0.08);
      engineGain._osc.frequency.setTargetAtTime(42 + drive * 50 + spd * 0.15, now, 0.1);
      if (chartGain) {
        const k = ship.locking ? ship.locking.progress : 0;
        chartGain.gain.setTargetAtTime(k * 0.03, now, 0.1);
        chartOsc.frequency.setTargetAtTime(360 + k * 280, now, 0.1);
      }
    }
  }

  let accT = 0, prev = 0, running = true;
  function frame(t) {
    if (!running) return;
    const raw = prev ? (t - prev) / 1000 : DT;
    prev = t;
    accT += Math.min(0.05, raw);
    let steps = 0;
    while (accT >= DT && steps < 6) { step(DT); accT -= DT; steps++; }
    render();
    drawMap();
    hud();
    requestAnimationFrame(frame);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) running = false;
    else { running = true; prev = 0; requestAnimationFrame(frame); }
  });

  setTimeout(() => { document.getElementById("title").style.opacity = 0; }, 1600);
  resize();
  bootShip();
  log("орбита · Лазурь");
  setMuted(false);
  requestAnimationFrame(frame);

  window.__sever = { ship, planets, gravityAt, step, updateCelestial, GM_STAR };
})();
</script>
</body>
</html>
