        '<path fill="currentColor" d="M373.2,190.8h-24.7c-2.5,0-4.4.1-5.8.4-2.5.4-4.8,1.4-6.6,2.8-2.2,1.7-3.3,3.7-3.3,6.1v18.9c0,3.3,1.7,5.9,5.2,7.7,1.7.9,3.6,1.5,5.6,1.8,1.2.2,3.2.2,6,.2h23.5c1.6,0,2.4-.8,2.4-2.5v-.8c0-1.6-.8-2.5-2.4-2.5h-23.5c-2.8,0-4.8-.2-6-.5-2.6-.7-4-2-4-3.8v-18.8c0-2.4,3-3.6,9-3.6h24.6c1.6,0,2.5-.8,2.5-2.5v-.8c0-1.6-.8-2.4-2.5-2.4Z"/>' +
        '<path fill="currentColor" d="M325.5,224.5c-.3-.8-1-1.6-1.5-2.3-1.4-1.9-2.7-3.7-4.1-5.6-1.8-2.4-3.6-4.9-5.3-7.3-1.8-2.5-3.6-5-5.5-7.5-1.8-2.7-3.8-5.2-5.7-7.9-.3-.4-.6-.8-.9-1.3-.9-1.4-2.3-1.9-4-1.9h-.4c-1.7,0-3,.5-4,1.9-.3.4-.6.8-.9,1.3-1.9,2.6-3.9,5.2-5.7,7.9-1.8,2.5-3.6,5-5.5,7.5-1.8,2.4-3.6,4.9-5.3,7.3-1.2,1.6-2.4,3.2-3.6,4.9-.5.7-1,1.4-1.5,2.1-1,1.3-1,3,.3,4.2.7.6,1.6.9,2.6.9s1.9-.5,2.7-1.6l5.8-8.1h29.4l6.1,8.4c.8,1.1,1.7,1.6,2.7,1.6s1.9-.3,2.6-.9c.6-.6,1.1-1.5,1.1-2.3,0-.3,0-.6-.2-.9ZM287.5,212.7l10.7-14.9,10.7,14.9h-21.5Z"/>' +
        '<path fill="currentColor" d="M389.4,212.8v6.2c0,2.7,3,4,8.9,4h24.4c1.6,0,2.4.8,2.4,2.4v.8c0,1.6-.8,2.5-2.4,2.5h-24.7c-.8,0-1.7,0-2.9-.2-8.4-.9-12.6-4-12.6-9.3v-18.8c0-3.5,2.1-6.2,6.2-7.9,2.8-1.2,6-1.7,9.9-1.7h24.2c1.6,0,2.4.8,2.4,2.4v.8c0,1.6-.8,2.5-2.4,2.5h-26.4c-4.7.4-7,1.7-7,4v6.6h33.4c.6,0,1.1.1,1.5.3.5.4.7,1,.7,1.9v.8c0,1.6-.8,2.5-2.4,2.5h-33.4Z"/>' +
        '</svg><span style="letter-spacing:0.14em;font-size:12px">POWER</span>';
      Object.assign(thrustBtn.style, {
        position: "absolute",
        left: "max(10px, env(safe-area-inset-left))",
        bottom: "max(14px, env(safe-area-inset-bottom))",
        zIndex: "9",
        pointerEvents: "auto",
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        justifyContent: "center",
        gap: "4px",
        border: "1px solid rgba(180,200,230,0.2)",
        background: "rgba(10, 12, 16, 0.78)",
        color: "#e8eef8",
        borderRadius: "11px",
        fontFamily: "inherit",
        padding: "10px 14px",
        backdropFilter: "blur(8px)",
        minWidth: "72px",
      });
      function setThrustVisual() {
        thrustBtn.style.background = thrusting
          ? "rgba(158, 193, 255, 0.28)"
          : "rgba(10, 12, 16, 0.78)";
        thrustBtn.style.borderColor = thrusting
          ? "rgba(158, 193, 255, 0.55)"
          : "rgba(180,200,230,0.2)";
        thrustBtn.style.color = thrusting ? "#f2f7ff" : "#e8eef8";
      }
      thrustBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (braking || thrustGate) return;
        if (gear === "N") requestGear("D");
        if (!canThrust()) return;
        armAudioFromThrust();
        thrusting = true;
        thrustPointer = true;
        setThrustVisual();
      });
      window.addEventListener("pointerup", () => {
        if (thrustPointer) {
          thrusting = false;
          thrustPointer = false;
          thrustGate = false;
          setThrustVisual();
        }
      });
      window.addEventListener("pointercancel", () => {
        if (thrustPointer) {
          thrusting = false;
          thrustPointer = false;
          thrustGate = false;
          setThrustVisual();
        }
      });
      stage.appendChild(thrustBtn);

      // Gear lever — D / N / R
      const gearBox = document.createElement("div");
      gearBox.className = "gearbox gear-D";
      gearBox.id = "gearBox";
      gearBox.innerHTML =
        '<div class="gear-label">GEAR</div>' +
        '<div class="gear-track" id="gearTrack">' +
        '<button type="button" class="gear-slot on-d" data-gear="D" aria-label="Drive">D</button>' +
        '<button type="button" class="gear-slot" data-gear="N" aria-label="Neutral">N</button>' +
        '<button type="button" class="gear-slot" data-gear="R" aria-label="Reverse">R</button>' +
        '<div class="gear-knob" id="gearKnob" aria-hidden="true"></div>' +
        "</div>";
      stage.appendChild(gearBox);

      setGearVisual = function () {
        const g = activeGear();
        gearBox.classList.remove("gear-D", "gear-N", "gear-R", "braking");
        gearBox.classList.add("gear-" + g);
        if (braking) gearBox.classList.add("braking");
        gearBox.querySelectorAll(".gear-slot").forEach((slot) => {
          slot.classList.toggle("on-d", g === "D" && slot.dataset.gear === "D");
          slot.classList.toggle("on-n", g === "N" && slot.dataset.gear === "N");
          slot.classList.toggle("on-r", g === "R" && slot.dataset.gear === "R");
        });
      };

      function gearFromClientY(clientY) {
        const track = document.getElementById("gearTrack");
        if (!track) return "N";
        const rect = track.getBoundingClientRect();
        const t = (clientY - rect.top) / Math.max(1, rect.height);
        if (t < 0.33) return "D";
        if (t < 0.66) return "N";
        return "R";
      }

      gearBox.addEventListener("pointerdown", (e) => {
        const slot = e.target.closest("[data-gear]");
        e.preventDefault();
        e.stopPropagation();
        gearBox.setPointerCapture(e.pointerId);
        if (slot) requestGear(slot.dataset.gear);
        else requestGear(gearFromClientY(e.clientY));
      });
      gearBox.addEventListener("pointermove", (e) => {
        if (!gearBox.hasPointerCapture(e.pointerId)) return;
        e.preventDefault();
        requestGear(gearFromClientY(e.clientY));
      });
      setGearVisual();

      const starLooksEl = document.getElementById("starLooks");
      if (starLooksEl) {
        starLooksEl.addEventListener("pointerdown", (e) => {
          const btn = e.target.closest("button[data-look]");
          if (!btn) return;
          e.preventDefault();
          e.stopPropagation();
          setStarLook(btn.dataset.look);
        });
      }

      const viewToggle = document.getElementById("viewToggle");
      if (viewToggle) {
        viewToggle.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          e.stopPropagation();
          setImmersive(!immersive);
        });
      }

      const ctrlToggle = document.getElementById("ctrlToggle");
      if (ctrlToggle) {
        ctrlToggle.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          e.stopPropagation();
          setStickMode(!stickMode);
        });
      }

      const joyEl = document.getElementById("joy");
      if (joyEl) {
        let joyPtr = null;
        joyEl.addEventListener("pointerdown", (e) => {
          if (!stickMode) return;
          e.preventDefault();
          e.stopPropagation();
          joyPtr = e.pointerId;
          joyActive = true;
          joyEl.classList.add("active");
          joyEl.setPointerCapture(e.pointerId);
          applyJoyFromEvent(e, joyEl);
        });
        joyEl.addEventListener("pointermove", (e) => {
          if (!joyActive || e.pointerId !== joyPtr) return;
          e.preventDefault();
          applyJoyFromEvent(e, joyEl);
        });
        const endJoy = (e) => {
          if (e && joyPtr != null && e.pointerId !== joyPtr) return;
          joyPtr = null;
          joyActive = false;
          resetJoyVisual();
          if (keys.size) syncStickFromKeys();
        };
        joyEl.addEventListener("pointerup", endJoy);
        joyEl.addEventListener("pointercancel", endJoy);
      }

      document.querySelectorAll(".pad button").forEach((btn) => {
        const dir = btn.dataset.dir;
        const down = (e) => {
          if (stickMode) return;
          e.preventDefault();
          keys.add(dir);
          syncStickFromKeys();
        };
        const up = (e) => {
          if (stickMode) return;
          e.preventDefault();
          keys.delete(dir);
          syncStickFromKeys();
        };
        btn.addEventListener("pointerdown", down);
        btn.addEventListener("pointerup", up);
        btn.addEventListener("pointerleave", up);
        btn.addEventListener("pointercancel", up);
      });

      let dragging = false;
      stage.addEventListener("pointerdown", (e) => {
        if (stickMode) return; // analog stick owns steering on touch
        if (e.target.closest(".pad, button, .audio-btn, .joy, .ctrl-toggle, .view-toggle, .star-looks, .gearbox, .galaxy-nav")) return;
        dragging = true;
        stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener("pointermove", (e) => {
        if (!dragging || stickMode) return;
        stickX = Math.max(-1, Math.min(1, (e.clientX / w) * 2 - 1));
        stickY = Math.max(-1, Math.min(1, (e.clientY / h) * 2 - 1));
      });
      const endDrag = () => {
        if (!dragging) return;
        dragging = false;
        if (keys.size) syncStickFromKeys();
        else { stickX = 0; stickY = 0; }
      };
      stage.addEventListener("pointerup", endDrag);
      stage.addEventListener("pointercancel", endDrag);

      // Speed is driven by Space / thrust button
      window.addEventListener("resize", resize);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) cancelAnimationFrame(raf);
        else { frame.prev = 0; raf = requestAnimationFrame(frame); }
      });

      try {
        buildCompass();
        resize();
        if (w < 2 || h < 2) {
          w = Math.max(320, window.innerWidth || 320);
          h = Math.max(480, window.innerHeight || 480);
          cx = w / 2; cy = h * 0.42;
        }
        init();
        raf = requestAnimationFrame(frame);
      } catch (err) {
        console.error(err);
        const box = document.createElement("div");
        box.textContent = "JS: " + (err && err.message ? err.message : String(err));
        Object.assign(box.style, {
          position: "fixed", left: "8px", top: "8px", zIndex: "99",
          color: "#fff", background: "rgba(120,0,0,0.85)", padding: "8px 10px",
          fontSize: "12px", maxWidth: "90%"
        });
        document.body.appendChild(box);
      }
    })();
  </script>
</body>
</html>
