<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Капсулы — балкон</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      :root {
        --ink: #1c1916;
        --muted: rgba(28, 25, 22, 0.62);
        --paper: rgba(246, 241, 234, 0.9);
        --line: rgba(28, 25, 22, 0.14);
        --copper: #9a6236;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #c5ccd1; color: var(--ink);
        font-family: "Liberation Sans", "Noto Sans", "DejaVu Sans", sans-serif;
        touch-action: none; user-select: none; -webkit-user-select: none;
      }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .hud, .prompt, .enter, .mobile {
        position: fixed; z-index: 4; pointer-events: none;
      }
      .hud-top, .hud-bottom {
        position: fixed; left: 0; right: 0; z-index: 4;
        display: flex; justify-content: space-between; gap: 16px;
        padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
        pointer-events: none;
      }
      .hud-bottom {
        top: auto; bottom: 0;
        padding: 0 max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        align-items: flex-end;
      }
      .card {
        background: var(--paper); border: 1px solid var(--line);
        border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(8px);
        max-width: min(420px, 78vw);
      }
      .brand {
        font-family: Georgia, "Liberation Serif", "Noto Serif", serif;
        font-size: 18px; letter-spacing: 0.08em; font-weight: 600;
      }
      .sub { margin-top: 2px; color: var(--muted); font-size: 12px; letter-spacing: 0.02em; }
      .spec { font-size: 12px; line-height: 1.45; color: var(--ink); }
      .spec b { font-weight: 650; }
      .where { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--copper); }
      .hint { font-size: 12px; color: var(--muted); }
      .hint b { color: var(--ink); font-weight: 650; }
      .cross {
        position: fixed; left: 50%; top: 50%; z-index: 3; width: 7px; height: 7px;
        margin: -3px 0 0 -3px; border: 1.5px solid rgba(255, 252, 247, 0.85);
        border-radius: 50%; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
        pointer-events: none;
      }
      .prompt {
        left: 50%; bottom: max(64px, calc(env(safe-area-inset-bottom) + 54px));
        transform: translateX(-50%);
        background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
        padding: 8px 14px; font-size: 13px; opacity: 0; transition: opacity 0.2s ease;
        white-space: nowrap;
      }
      .prompt.on { opacity: 1; }
      .enter {
        inset: 0; display: grid; place-items: center;
        background: rgba(20, 18, 16, 0.28); pointer-events: auto; cursor: pointer;
      }
      .enter-card {
        width: min(440px, calc(100% - 36px));
        background: var(--paper); border-radius: 18px; padding: 22px 22px 18px;
        border: 1px solid var(--line); text-align: left;
      }
      .enter h1 {
        font-family: Georgia, "Liberation Serif", serif;
        font-size: 28px; font-weight: 600; letter-spacing: 0.04em;
      }
      .enter p { margin-top: 8px; font-size: 14px; line-height: 1.45; color: var(--muted); }
      .enter .go { margin-top: 14px; color: var(--copper); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
      body.playing .enter { display: none; }
      body.shot .enter { display: none; }
      .mobile { display: none; }
      @media (pointer: coarse) {
        .cross { display: none; }
        .mobile { display: block; }
        .hint-desktop { display: none; }
      }
      .joy-zone, .look-zone { position: fixed; bottom: 0; top: 0; pointer-events: auto; }
      .joy-zone { left: 0; width: 46%; }
      .look-zone { right: 0; width: 54%; }
      .joy-base {
        position: absolute; left: max(28px, env(safe-area-inset-left));
        bottom: max(28px, env(safe-area-inset-bottom));
        width: 116px; height: 116px; border-radius: 50%;
        border: 1px solid rgba(28, 25, 22, 0.18);
        background: rgba(246, 241, 234, 0.42);
      }
      .joy-knob {
        position: absolute; left: 38px; top: 38px; width: 40px; height: 40px; border-radius: 50%;
        background: rgba(246, 241, 234, 0.92); border: 1px solid rgba(28, 25, 22, 0.16);
      }
      .actions {
        position: fixed; right: max(14px, env(safe-area-inset-right));
        bottom: max(22px, env(safe-area-inset-bottom));
        display: flex; flex-direction: column; gap: 8px; pointer-events: auto; z-index: 6;
      }
      .actions button {
        border: 1px solid var(--line); background: var(--paper); color: var(--ink);
        border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 13px;
      }
      #selftest {
        position: fixed; inset: auto 12px 12px 12px; z-index: 9;
        background: #fff; color: #111; padding: 12px; font-size: 12px; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div class="cross" aria-hidden="true"></div>
    <header class="hud-top">
      <div class="card">
        <div class="brand">КАПСУЛЫ</div>
        <div class="sub">балкон · две спальни по 3 м³</div>
      </div>
      <div class="card spec">
        <div><b>01 нижняя</b> — 3 м³, без окон</div>
        <div><b>02 верхняя</b> — 3 м³, панорама на дом</div>
      </div>
    </header>
    <footer class="hud-bottom">
      <div class="card hint hint-desktop"><b>WASD</b> ходить · <b>мышь</b> смотреть · <b>C</b> пригнуться · <b>E</b> лечь или встать</div>
      <div class="card where" id="where">тамбур</div>
    </footer>
    <div class="prompt" id="prompt"></div>
    <button class="enter" id="enter" type="button">
      <div class="enter-card">
        <h1>Балкон доделан</h1>
        <p>Шкаф и чемодан ушли. На их месте две капсулы: нижняя глухая, верхняя с панорамным окном на многоэтажный дом и город. Тамбур — розовая стена, подоконник и зеркало.</p>
        <div class="go">Нажмите, чтобы войти</div>
      </div>
    </button>
    <div class="mobile" id="mobile">
      <div class="joy-zone" id="joy-zone" aria-label="Ходьба">
        <div class="joy-base" id="joy-base"><div class="joy-knob" id="joy-knob"></div></div>
      </div>
      <div class="look-zone" id="look-zone" aria-label="Взгляд"></div>
      <div class="actions">
        <button type="button" id="btn-use">лечь</button>
        <button type="button" id="btn-crouch">пригнуться</button>
      </div>
    </div>
    <script src="./vendor/three.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
