<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>КОПЭ, 15 этаж — 3D</title>
  <style>
    :root {
      --ink: #243042;
      --muted: #5d6b7c;
      --paper: rgba(247, 249, 252, 0.94);
      --line: rgba(36, 48, 66, 0.12);
      --accent: #3d6f8f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: #b7cbe0; color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    }
    #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
    .panel {
      position: fixed; z-index: 2; top: 14px; left: 14px; width: min(340px, calc(100% - 28px));
      max-height: calc(100% - 28px); overflow: auto;
      background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
      padding: 16px 16px 14px; box-shadow: 0 16px 50px rgba(20, 32, 48, 0.16);
      backdrop-filter: blur(12px);
    }
    h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.03em; margin: 0 0 4px; }
    .note { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
    button {
      appearance: none; border: 1px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 999px; padding: 7px 11px; font: inherit; font-size: 13px; cursor: pointer;
    }
    button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .plan { width: 100%; height: auto; display: block; margin: 2px 0 10px; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin: 0 0 10px; font-size: 12px; color: var(--muted); }
    .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    kbd { font-family: inherit; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 4px; background: #fff; }
    #hint { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
    #play {
      position: fixed; z-index: 3; inset: 0; display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    #play span {
      pointer-events: none; background: rgba(24, 32, 44, 0.78); color: #fff;
      border-radius: 999px; padding: 12px 18px; font-size: 15px;
    }
    #crosshair {
      position: fixed; z-index: 2; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
      border: 1.5px solid #fff; border-radius: 50%; display: none; pointer-events: none;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="crosshair"></div>
  <div id="play"><span>Клик — ходить по квартире</span></div>
  <aside class="panel">
    <h1>КОПЭ, 15 этаж</h1>
    <p class="note">Двушка с балконом из большой комнаты. Остальные квартиры закрыты. Размеры типовые для серии, не обмер.</p>
    <div class="row" id="views">
      <button type="button" data-view="room" class="active">В комнате</button>
      <button type="button" data-view="balcony">Балкон</button>
      <button type="button" data-view="kitchen">Кухня</button>
      <button type="button" data-view="outside">Весь дом</button>
    </div>
    <svg class="plan" viewBox="0 0 220 250" xmlns="http://www.w3.org/2000/svg" aria-label="Схема квартиры">
      <rect x="8" y="28" width="92" height="118" fill="#f3e6c8" stroke="#243042" stroke-width="2"/>
      <rect x="100" y="28" width="92" height="96" fill="#e7eef6" stroke="#243042" stroke-width="2"/>
      <rect x="8" y="146" width="92" height="40" fill="#f7f1e6" stroke="#243042" stroke-width="2"/>
      <rect x="8" y="186" width="48" height="48" fill="#e8e4ef" stroke="#243042" stroke-width="2"/>
      <rect x="56" y="186" width="44" height="28" fill="#ece8f2" stroke="#243042" stroke-width="2"/>
      <rect x="100" y="124" width="92" height="36" fill="#f7f1e6" stroke="#243042" stroke-width="2"/>
      <rect x="100" y="160" width="92" height="74" fill="#f6efe4" stroke="#243042" stroke-width="2"/>
      <rect x="18" y="8" width="72" height="20" fill="#d5e4ef" stroke="#243042" stroke-width="2"/>
      <text x="54" y="92" text-anchor="middle" font-size="11" fill="#243042">комната с балконом</text>
      <text x="146" y="80" text-anchor="middle" font-size="11" fill="#243042">спальня</text>
      <text x="54" y="170" text-anchor="middle" font-size="11" fill="#243042">холл</text>
      <text x="146" y="204" text-anchor="middle" font-size="11" fill="#243042">кухня</text>
      <text x="32" y="214" text-anchor="middle" font-size="10" fill="#243042">с/у</text>
      <text x="54" y="22" text-anchor="middle" font-size="10" fill="#243042">балкон</text>
    </svg>
    <div class="legend">
      <span><i class="sw" style="background:#c4a574"></i>плитка фасада</span>
      <span><i class="sw" style="background:#f4f1ea;border:1px solid #ddd"></i>рёбра и балконы</span>
    </div>
    <p id="hint"><kbd>WASD</kbd> ходить, мышь смотреть, <kbd>Shift</kbd> бежать, <kbd>Esc</kbd> отпустить мышь.</p>
  </aside>
  <script src="../living-room/vendor/three.js"></script>
  <script src="main.js"></script>
</body>
</html>
